<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Чемодан без ручки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;900&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
} }
</script>
<style>
:root{--ink:#2B2140;--or:#FF6B35;--yl:#FFD166;--tl:#2EC4B6;--gr:#7BC96F;--sky:#8EDCEB;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--sky);font-family:Rubik,system-ui,sans-serif;color:var(--ink);
  user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.layer{position:fixed;inset:0;pointer-events:none;display:none}
.layer.on{display:block}
.layer *{pointer-events:auto}
.layer .pe-none{pointer-events:none}
button{font-family:inherit;color:var(--ink);border:0;cursor:pointer;touch-action:manipulation}
.btn{background:#fff;border-radius:20px;font-weight:900;box-shadow:0 6px 0 rgba(43,33,64,.25)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(43,33,64,.25)}
.btn.green{background:var(--gr);box-shadow:0 6px 0 #4A9645}
.btn.orange{background:var(--or);box-shadow:0 6px 0 #C9481C}
.btn.yellow{background:var(--yl);box-shadow:0 6px 0 #D9A92F}
.btn.green:active,.btn.orange:active,.btn.yellow:active{box-shadow:0 2px 0 rgba(0,0,0,.25)}

/* меню */
#menu{background:linear-gradient(transparent 55%,rgba(43,33,64,.15))}
#menu .title{position:absolute;top:calc(var(--st) + 7vh);left:0;right:0;text-align:center;pointer-events:none}
#menu h1{margin:0;font-size:clamp(46px,13vw,80px);line-height:.92;font-weight:900;letter-spacing:-1px;color:var(--ink);text-shadow:0 4px 0 #fff}
#menu p{margin:12px 20px 0;font-size:17px;font-weight:500}
#menu .go{position:absolute;left:50%;bottom:calc(var(--sb) + 9vh);transform:translateX(-50%);width:min(300px,80vw);height:84px;font-size:32px}
#menu .go:active{transform:translate(-50%,4px)}
.sound{position:absolute;top:calc(var(--st) + 14px);right:14px;width:52px;height:52px;border-radius:16px;font-size:13px}

/* выбор уровня */
#levels{background:rgba(43,33,64,.55)}
#levels .wrap{position:absolute;inset:calc(var(--st) + 20px) 14px calc(var(--sb) + 20px);display:flex;flex-direction:column;gap:12px;overflow-y:auto;touch-action:pan-y}
#levels h2{margin:0 4px 4px;color:#fff;font-size:30px;font-weight:900}
.lvl{display:flex;gap:12px;align-items:center;background:#fff;border-radius:24px;padding:10px 14px 10px 10px;text-align:left;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.lvl:active{transform:translateY(3px)}
.lvl img{width:76px;height:76px;border-radius:18px;background:var(--sky);flex:none}
.lvl b{display:block;font-size:19px;line-height:1.15}
.lvl small{display:block;font-size:14px;font-weight:500;opacity:.75;margin-top:2px}
.lvl .st{margin-top:4px;font-size:20px;letter-spacing:2px;color:#E7E2EE}
.lvl .st i{font-style:normal;color:#FFB627}

/* верхняя панель уровня */
#top{top:calc(var(--st) + 10px);left:10px;right:10px;bottom:auto;gap:8px;align-items:center;pointer-events:none}
#top.on{display:flex}
#homeBtn{width:48px;height:48px;border-radius:15px;flex:none;pointer-events:auto;display:flex;align-items:center;justify-content:center}
#levelTitle{font-weight:900;font-size:16px;background:rgba(255,255,255,.85);padding:6px 12px;border-radius:12px}

/* упаковка */
#order{position:absolute;top:calc(var(--st) + 66px);left:10px;right:10px;display:flex;gap:8px;align-items:center;background:#fff;border-radius:20px;padding:8px;box-shadow:0 4px 0 rgba(43,33,64,.15)}
#order .face{width:54px;height:54px;border-radius:50%;background:var(--sky);flex:none}
#order .need{display:flex;gap:6px;flex-wrap:wrap}
#order .need div{position:relative;width:46px;height:46px;border-radius:12px;background:#F4F1EC}
#order .need img{width:46px;height:46px}
#order .need div.ok{background:#EAF8EC}
#order .need div.ok::after{content:'✓';position:absolute;right:-5px;bottom:-5px;width:22px;height:22px;border-radius:50%;background:var(--gr);color:#fff;font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center}
#checks{position:absolute;top:calc(var(--st) + 142px);left:10px;right:10px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.chip{background:#fff;border-radius:14px;padding:4px 4px 5px;display:flex;flex-direction:column;align-items:center;text-align:center;border:3px solid #FFD166;box-shadow:0 3px 0 rgba(43,33,64,.15);transition:border-color .2s}
.chip.ok{border-color:#7BC96F}.chip.bad{border-color:#FF6B35}
.chip small{font-size:11px;font-weight:700;opacity:.65;line-height:1.2}
.chip b{font-size:13px;font-weight:900;line-height:1.15}
.chip.ok b{color:#3f8a3a}.chip.bad b{color:#d8481c}
.lv{position:relative;width:86%;height:10px;margin-top:4px;border-radius:999px;background:linear-gradient(90deg,#FFD9C9,#EAF8EC 35%,#EAF8EC 65%,#FFD9C9)}
.lv i{position:absolute;top:-3px;left:50%;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:#2EC4B6;box-shadow:0 0 0 2px #fff;transition:left .25s}
#hint{position:absolute;left:0;right:0;bottom:calc(var(--sb) + 200px);text-align:center;font-weight:700;font-size:16px;color:#fff;text-shadow:0 2px 0 rgba(43,33,64,.5);pointer-events:none}
#qpanel{position:absolute;left:10px;right:10px;bottom:calc(var(--sb) + 98px);background:#fff;border-radius:22px;padding:8px 10px 10px;box-shadow:0 4px 0 rgba(43,33,64,.15)}
#qpanel .bar{margin:0 0 8px;height:12px;background:#F4F1EC}
#qtime{background:var(--or)}
.qrow{display:flex;align-items:center;gap:8px}
.qrow>small{font-size:13px;font-weight:700;opacity:.6}
#qnext{display:flex;gap:6px;flex:1}
#qnext div{position:relative;width:52px;height:52px;border-radius:14px;background:#F4F1EC}
#qnext div:first-child{box-shadow:inset 0 0 0 3px var(--yl)}
#qnext div.req::before{content:'';position:absolute;top:4px;left:4px;width:11px;height:11px;border-radius:50%;background:var(--or);box-shadow:0 0 0 2px #fff;z-index:1}
#qnext img{width:100%;height:100%}
.qend{font-weight:700;font-size:14px;opacity:.6}
#qleft{font-size:14px;font-weight:900;opacity:.7;white-space:nowrap}
#packBar{position:absolute;left:10px;right:10px;bottom:calc(var(--sb) + 16px);display:flex;gap:10px}
#packBar .btn{flex:1;height:70px;font-size:19px;display:flex;align-items:center;justify-content:center;gap:8px}

/* крышка */
#lidTop{position:absolute;top:calc(var(--st) + 70px);left:16px;right:16px}
#lidTop b{font-size:24px;font-weight:900;color:#fff;text-shadow:0 2px 0 rgba(43,33,64,.4)}
.bar{height:22px;border-radius:999px;background:#fff;overflow:hidden;margin-top:8px}
.bar>div{height:100%;width:0;background:var(--or);border-radius:999px;transition:width .2s}
#jumpWrap{position:absolute;left:50%;bottom:calc(var(--sb) + 40px);transform:translateX(-50%);width:180px;height:180px;border-radius:50%;border:6px dashed var(--or);display:flex;align-items:center;justify-content:center}
#jumpBtn{width:146px;height:146px;border-radius:50%;font-size:34px}

/* дорога */
#prog{position:absolute;top:calc(var(--st) + 70px);left:14px;right:190px;height:16px;background:#fff;border-radius:999px}
#prog>div{height:100%;width:0;background:var(--yl);border-radius:999px}
#prog>span{position:absolute;top:-8px;width:30px;height:30px;margin-left:-15px;border-radius:9px;background:var(--or);box-shadow:inset 0 -7px 0 #C9481C;z-index:2}
#prog .rv{position:absolute;top:-4px;width:20px;height:20px;margin-left:-10px;border-radius:6px;box-shadow:0 0 0 2px #fff;left:0}
#race{position:absolute;top:calc(var(--st) + 100px);left:14px;display:flex;align-items:center;gap:6px;background:#fff;border-radius:16px;padding:4px 12px 4px 10px;box-shadow:0 4px 0 rgba(43,33,64,.15);border:3px solid #FF6B35}
#race.first{border-color:#7BC96F}
#race>b{font-size:30px;font-weight:900;line-height:1}
#race small{font-size:11px;font-weight:700;line-height:1.1;opacity:.7}
#race .stk{margin-left:8px;font-size:16px;font-weight:900;color:#d9a92f}
#xray{position:absolute;top:calc(var(--st) + 66px);right:12px;width:168px;height:118px;border-radius:16px;box-shadow:0 0 0 4px #fff;pointer-events:none}
#xray span{position:absolute;left:8px;top:6px;font-size:12px;font-weight:700;color:#8EDCEB}
#ctrl{position:absolute;left:12px;right:12px;bottom:calc(var(--sb) + 22px);display:flex;gap:10px;align-items:flex-end}
.arrow{width:84px;height:84px;border-radius:24px;display:flex;align-items:center;justify-content:center}
#ctrl .sp{flex:1}
#fenBtn{width:84px;height:84px;border-radius:24px;font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
#fenBtn img{width:46px;height:46px}
#hopBtn{width:112px;height:112px;border-radius:50%;font-size:22px}

/* финал */
#res{position:absolute;left:12px;right:12px;bottom:calc(var(--sb) + 104px);background:#fff;border-radius:26px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 6px 0 rgba(43,33,64,.2);transform:translateY(40px);opacity:0;transition:all .4s}
#res.show{transform:none;opacity:1}
#stars{display:flex;justify-content:center;gap:6px;font-size:52px;line-height:1}
#stars i{font-style:normal;color:#E7E2EE;transition:transform .3s}
#stars i.on{color:#FFC83D;text-shadow:0 3px 0 #D9A92F;transform:scale(1.12)}
#stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
#stats div{border-radius:14px;padding:8px 2px;background:#F4F1EC}
#stats b{display:block;font-size:21px;font-weight:900}
#stats small{font-size:12px;font-weight:500}
#line{margin:0;text-align:center;font-size:16px;font-weight:700}
#events{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
#events span{background:var(--yl);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:700}
#finBar{position:absolute;left:12px;right:12px;bottom:calc(var(--sb) + 20px);display:flex;gap:10px}
#finBar .sq{width:66px;height:66px;flex:none;display:flex;align-items:center;justify-content:center}
#nextBtn{flex:1;height:66px;font-size:24px}

/* тост */
#toast{position:fixed;left:50%;top:calc(var(--st) + 34%);transform:translate(-50%,-50%) scale(.6);background:#fff;padding:12px 18px;border-radius:20px;font-weight:900;font-size:21px;text-align:center;
  max-width:86vw;box-shadow:0 6px 0 rgba(43,33,64,.25);opacity:0;transition:all .25s cubic-bezier(.3,1.6,.6,1);pointer-events:none;z-index:20}
#toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--sky);font-weight:900;font-size:24px;z-index:30;text-align:center;padding:20px}
svg.i{width:26px;height:26px;fill:none;stroke:var(--ink);stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="menu" class="layer">
  <div class="title"><h1>Чемодан<br>без ручки</h1><p>Нести тяжело, бросить жалко</p></div>
  <button class="btn sound" id="soundBtn" aria-label="Звук">ЗВУК<br>ВКЛ</button>
  <button class="btn green go" id="playBtn">Играть!</button>
</div>

<div id="levels" class="layer"><div class="wrap" id="levelList"></div></div>

<div id="top" class="layer">
  <button class="btn" id="homeBtn" aria-label="В меню"><svg class="i" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg></button>
  <span id="levelTitle"></span>
</div>

<div id="pack" class="layer">
  <div id="order"><img class="face" id="clientFace" alt=""><div class="need" id="need"></div></div>
  <div id="checks" class="pe-none">
    <div class="chip" id="chOrder"><small>Заказ</small><b>0/0</b></div>
    <div class="chip" id="chLid"><small>Крышка</small><b>—</b></div>
    <div class="chip" id="chFrag"><small>Хрупкое</small><b>—</b></div>
    <div class="chip" id="chBal"><small>Баланс</small><div class="lv"><i id="bub"></i></div></div>
  </div>
  <div id="hint">Веди пальцем по чемодану — вещь поедет следом.<br>Отпусти — упадёт</div>
  <div id="qpanel">
    <div class="bar"><div id="qtime"></div></div>
    <div class="qrow"><small>Дальше</small><div id="qnext"></div><span id="qleft"></span></div>
  </div>
  <div id="packBar">
    <button class="btn yellow" id="rotBtn"><svg class="i" viewBox="0 0 24 24" style="width:30px;height:30px"><path d="M20 12a8 8 0 1 1-2.3-5.7L20 8.5"/><path d="M20 3.5v5h-5"/></svg>Повернуть</button>
    <button class="btn" id="skipBtn"><svg class="i" viewBox="0 0 24 24" style="width:30px;height:30px"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 13l4 4M14 13l-4 4"/></svg>Оставить дома</button>
  </div>
</div>

<div id="lidui" class="layer">
  <div id="lidTop" class="pe-none"><b id="lidText">Не закрывается!</b><div class="bar"><div id="lidBar"></div></div></div>
  <div id="jumpWrap"><button class="btn orange" id="jumpBtn">ПРЫГ!</button></div>
</div>

<div id="journey" class="layer">
  <div id="prog" class="pe-none"><div id="progFill"></div><i class="rv" id="rv0" style="background:#5aa9e6"></i><i class="rv" id="rv1" style="background:#9b6bcc"></i><i class="rv" id="rv2" style="background:#7bc96f"></i><span id="progDot"></span></div>
  <div id="race" class="pe-none"><b id="placeN">1</b><small>место<br>из 4</small><span class="stk">★ <b id="stickN">0</b></span></div>
  <div id="xray"><span>Рентген</span></div>
  <div id="ctrl">
    <button class="btn arrow" id="leftBtn" aria-label="Назад"><svg class="i" viewBox="0 0 24 24" style="width:40px;height:40px"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="btn arrow" id="rightBtn" aria-label="Вперёд"><svg class="i" viewBox="0 0 24 24" style="width:40px;height:40px"><path d="M9 5l7 7-7 7"/></svg></button>
    <div class="sp"></div>
    <button class="btn yellow" id="fenBtn"><img id="fenImg" alt=""><span id="fenN">×2</span></button>
    <button class="btn orange" id="hopBtn">Прыг!</button>
  </div>
</div>

<div id="finale" class="layer">
  <div id="res">
    <div id="stars"><i>★</i><i>★</i><i>★</i></div>
    <div id="stats"></div>
    <div id="events"></div>
    <p id="line"></p>
    <p id="starHint" style="margin:0;text-align:center;font-size:13px;font-weight:500;opacity:.75"></p>
  </div>
  <div id="finBar">
    <button class="btn sq" id="againBtn" aria-label="Ещё раз"><svg class="i" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.3-5.7L4 8.5"/><path d="M4 3.5v5h5"/></svg></button>
    <button class="btn sq" id="shareBtn" aria-label="Отправить другу"><svg class="i" viewBox="0 0 24 24"><path d="M21 3L3 10.5l7 2.5 2.5 7z"/><path d="M10 13l11-10"/></svg></button>
    <button class="btn green" id="nextBtn">Дальше</button>
  </div>
</div>

<div id="toast"></div>
<div id="loading">Пакуем чемодан…</div>

<script>
  window.addEventListener('error', function (e) {
    var l = document.getElementById('loading');
    if (l && l.style.display !== 'none') l.textContent = 'Ой! Чемодан не открылся: ' + (e.message || 'ошибка');
  });
</script>
<script type="module">
import * as THREE from 'three';
import * as CANNON from 'cannon-es';
// ===== audio.js =====
// Синтезированные звуки: ничего не грузим, всё рисуем осцилляторами.
let ctx = null;
let master = null;
const last = {};

function initAudio() {
  try {
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain();
      master.gain.value = 0.7;
      master.connect(ctx.destination);
    }
    if (ctx.state === 'suspended') ctx.resume();
  } catch (e) { ctx = null; }
}

function setMuted(m) { if (master) master.gain.value = m ? 0 : 0.7; }

function ok(name, gap = 0.07) {
  if (!ctx) return false;
  const t = ctx.currentTime;
  if (last[name] && t - last[name] < gap) return false;
  last[name] = t;
  return true;
}

function tone({ f = 440, f2 = null, type = 'sine', dur = 0.2, vol = 0.2, delay = 0, attack = 0.005 }) {
  const t0 = ctx.currentTime + delay;
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f, t0);
  if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(master);
  o.start(t0); o.stop(t0 + dur + 0.05);
}

function noise({ dur = 0.3, vol = 0.2, freq = 1500, q = 1, delay = 0, sweep = null }) {
  const t0 = ctx.currentTime + delay;
  const len = Math.floor(ctx.sampleRate * dur);
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = ctx.createBufferSource();
  src.buffer = buf;
  const flt = ctx.createBiquadFilter();
  flt.type = 'bandpass';
  flt.frequency.setValueAtTime(freq, t0);
  if (sweep) flt.frequency.exponentialRampToValueAtTime(sweep, t0 + dur);
  flt.Q.value = q;
  const g = ctx.createGain();
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(flt); flt.connect(g); g.connect(master);
  src.start(t0);
}

const sfx = {
  pick() { if (ok('pick')) tone({ f: 520, f2: 780, type: 'triangle', dur: 0.09, vol: 0.12 }); },
  drop() { if (ok('drop')) tone({ f: 260, f2: 120, type: 'sine', dur: 0.14, vol: 0.18 }); },
  boing() { if (ok('boing', 0.12)) tone({ f: 150, f2: 600, type: 'triangle', dur: 0.32, vol: 0.22 }); },
  thud() { if (ok('thud', 0.1)) { tone({ f: 110, f2: 40, type: 'sine', dur: 0.25, vol: 0.35 }); noise({ dur: 0.12, vol: 0.12, freq: 400 }); } },
  squeak() { if (ok('squeak', 0.15)) { tone({ f: 1100, f2: 1700, type: 'square', dur: 0.08, vol: 0.06 }); tone({ f: 1700, f2: 1000, type: 'square', dur: 0.1, vol: 0.05, delay: 0.08 }); } },
  crash() { if (ok('crash', 0.2)) { noise({ dur: 0.5, vol: 0.35, freq: 3000, q: 0.7 }); tone({ f: 2400, f2: 1800, type: 'triangle', dur: 0.3, vol: 0.08 }); tone({ f: 3100, f2: 2600, type: 'triangle', dur: 0.25, vol: 0.06, delay: 0.05 }); } },
  splat() { if (ok('splat', 0.2)) { noise({ dur: 0.35, vol: 0.4, freq: 300, sweep: 120, q: 0.8 }); } },
  cluck() { if (ok('cluck', 0.4)) { [0, 0.11, 0.2].forEach((d, i) => tone({ f: 700 - i * 60, f2: 420, type: 'square', dur: 0.08, vol: 0.06, delay: d })); } },
  coo() { if (ok('coo', 0.4)) { tone({ f: 330, f2: 260, type: 'sine', dur: 0.18, vol: 0.15 }); tone({ f: 340, f2: 250, type: 'sine', dur: 0.22, vol: 0.15, delay: 0.2 }); } },
  meow() { if (ok('meow', 0.6)) { tone({ f: 600, f2: 900, type: 'sawtooth', dur: 0.18, vol: 0.05 }); tone({ f: 900, f2: 500, type: 'sawtooth', dur: 0.25, vol: 0.05, delay: 0.17 }); } },
  whoosh() { if (ok('whoosh', 0.2)) noise({ dur: 0.45, vol: 0.3, freq: 400, sweep: 3000, q: 0.6 }); },
  pop() { if (ok('pop', 0.08)) tone({ f: 500, f2: 90, type: 'sine', dur: 0.12, vol: 0.25 }); },

// Low-poly модели из примитивов. Всё с flatShading — отсюда «гранёный» вид.


const matCache = new Map();
function M(color, opts = {}) {
  const { unique, ...rest } = opts;
  const key = color + JSON.stringify(rest);
  if (!unique && matCache.has(key)) return matCache.get(key);
  const m = new THREE.MeshStandardMaterial({ color, flatShading: true, roughness: 0.85, metalness: 0, ...rest });
  if (!unique) matCache.set(key, m);
  return m;
}

function mesh(geo, color, opts) {
  const m = new THREE.Mesh(geo, M(color, opts));
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}
function at(o, x = 0, y = 0, z = 0) { o.position.set(x, y, z); return o; }
function rot(o, x = 0, y = 0, z = 0) { o.rotation.set(x, y, z); return o; }

const G = THREE;
const box = (w, h, d) => new G.BoxGeometry(w, h, d);
const cyl = (rt, rb, h, s = 7) => new G.CylinderGeometry(rt, rb, h, s);
const cone = (r, h, s = 6) => new G.ConeGeometry(r, h, s);
const ico = (r, d = 0) => new G.IcosahedronGeometry(r, d);
const sph = (r) => new G.SphereGeometry(r, 8, 6);

function googly(r = 0.07) {
  const g = new G.Group();
  const w = new G.Mesh(sph(r), M(0xffffff, { roughness: 0.4 }));
  const p = new G.Mesh(sph(r * 0.52), M(0x2b2140, { roughness: 0.3 }));
  p.position.set((Math.random() - 0.5) * r * 0.5, (Math.random() - 0.5) * r * 0.5, r * 0.62);
  g.add(w, p);
  g.userData.pupil = p;
  return g;
}

// Собрать модель предмета, отцентрованную по своей рамке.
function makeItemMesh(id) {
  const def = ITEMS[id];
  const inner = def.build();
  const bb = new G.Box3().setFromObject(inner);
  const c = bb.getCenter(new G.Vector3());
  const s = bb.getSize(new G.Vector3());
  inner.position.sub(c);
  if (!def.size) def.size = s.clone();
  const outer = new G.Group();
  outer.add(inner);
  outer.userData.inner = inner;
  return outer;
}

function makeShards(color = 0xffffff, w = 0.6, d = 0.5) {
  const g = new G.Group();
  for (let i = 0; i < 7; i++) {
    const s = mesh(new G.TetrahedronGeometry(0.06 + Math.random() * 0.07), i % 3 === 0 ? 0xffffff : color);
    s.position.set((Math.random() - 0.5) * w, -0.05 + Math.random() * 0.06, (Math.random() - 0.5) * d);
    s.rotation.set(Math.random() * 3, Math.random() * 3, Math.random() * 3);
    g.add(s);
  }
  return g;
}

function makeSuitcase(W, D, H, T, LIDH, pal = {}) {
  const g = new G.Group();
  const shell = new G.Group(); g.add(shell);
  const OR = pal.main ?? 0xff7043, DK = pal.dark ?? 0xc9481c, LN = 0x8c4a6e, YL = pal.strap ?? 0xffd166, LT = pal.light ?? 0xff9a6b;
  shell.add(at(mesh(box(W + 2 * T, T, D + 2 * T), OR), 0, -T / 2, 0));
  shell.add(at(mesh(box(W, 0.02, D), 0xa35c80), 0, 0.01, 0));
  shell.add(at(mesh(box(W + 2 * T, H, T), OR), 0, H / 2, D / 2 + T / 2));
  shell.add(at(mesh(box(W + 2 * T, H, T), DK), 0, H / 2, -D / 2 - T / 2));
  shell.add(at(mesh(box(T, H, D), DK), -W / 2 - T / 2, H / 2, 0));
  shell.add(at(mesh(box(T, H, D), DK), W / 2 + T / 2, H / 2, 0));
  shell.add(at(mesh(box(W, H, 0.02), LN), 0, H / 2, D / 2 - 0.01));
  shell.add(at(mesh(box(W, H, 0.02), LN), 0, H / 2, -D / 2 + 0.01));
  shell.add(at(mesh(box(0.02, H, D), LN), -W / 2 + 0.01, H / 2, 0));
  shell.add(at(mesh(box(0.02, H, D), LN), W / 2 - 0.01, H / 2, 0));
  [-0.85, 0.85].forEach((x) => shell.add(at(mesh(box(0.24, H + T + 0.02, 0.03), YL), x, (H - T) / 2, D / 2 + T + 0.01)));
  [[-1, 1], [1, 1]].forEach(([sx]) => shell.add(at(mesh(box(0.22, 0.22, 0.04), 0x2b2140), sx * (W / 2 + T - 0.11), -T + 0.11, D / 2 + T + 0.02)));
  // колёса: одного не хватает
  const wheelGeo = cyl(0.16, 0.16, 0.12, 8);
  [[-W / 2 + 0.2, D / 2], [-W / 2 + 0.2, -D / 2], [W / 2 - 0.2, -D / 2]].forEach(([x, z]) => {
    const w = rot(at(mesh(wheelGeo, 0x2b2140), x, -T - 0.14, z), Math.PI / 2, 0, 0);
    shell.add(w);
  });
  shell.add(at(mesh(box(0.08, 0.16, 0.08), 0x2b2140), W / 2 - 0.2, -T - 0.05, D / 2));
  // наклейка-звезда
  const star = new G.Shape();
  for (let i = 0; i < 10; i++) { const r = i % 2 ? 0.1 : 0.24; const a = i / 10 * Math.PI * 2 + Math.PI / 2; const x = Math.cos(a) * r, y = Math.sin(a) * r; i ? star.lineTo(x, y) : star.moveTo(x, y); }
  shell.add(at(new G.Mesh(new G.CircleGeometry(0.3, 10), M(0xffffff)), 0, H * 0.45, D / 2 + T + 0.02));
  shell.add(at(new G.Mesh(new G.ShapeGeometry(star), M(0x2ec4b6)), 0, H * 0.45, D / 2 + T + 0.03));

  const lidPivot = new G.Group();
  lidPivot.position.set(0, H, -D / 2 - T);
  g.add(lidPivot);
  const lid = new G.Group(); lidPivot.add(lid);
  lid.add(at(mesh(box(W + 2 * T, LIDH, D + 2 * T), LT), 0, LIDH / 2, D / 2 + T));
  lid.add(at(mesh(box(W, 0.03, D), LN), 0, 0.0, D / 2 + T));
  [-0.85, 0.85].forEach((x) => lid.add(at(mesh(box(0.24, LIDH + 0.02, 0.03), YL), x, LIDH / 2, D + 2 * T + 0.01)));
  [-0.85, 0.85].forEach((x) => lid.add(at(mesh(box(0.24, 0.03, D + 2 * T), 0xffe08f), x, LIDH + 0.01, D / 2 + T)));
  // огрызки ручки
  lid.add(at(mesh(box(0.1, 0.12, 0.12), 0x2b2140), -0.32, LIDH + 0.06, D / 2 + T));
  lid.add(at(mesh(box(0.1, 0.07, 0.12), 0x2b2140), 0.32, LIDH + 0.035, D / 2 + T));
  return { group: g, shell, lidPivot, lid };
}

// ---------- ЛЮДИ ----------
function makePerson(o = {}) {
  const g = new G.Group();
  const skin = o.skin ?? 0xffd3b0, dress = o.dress ?? 0x9b6bcc;
  g.add(at(mesh(cyl(0.08, 0.08, 0.5, 5), 0x2b2140), -0.15, 0.27, 0));
  g.add(at(mesh(cyl(0.08, 0.08, 0.5, 5), 0x2b2140), 0.15, 0.27, 0));
  g.add(at(mesh(box(0.18, 0.09, 0.28), 0x2b2140), -0.15, 0.05, 0.05));
  g.add(at(mesh(box(0.18, 0.09, 0.28), 0x2b2140), 0.15, 0.05, 0.05));
  const body = at(mesh(cyl(0.3, 0.55, 0.95, 7), dress), 0, 0.95, 0); g.add(body);
  if (o.suit) body.material = M(0xf4f4f8);
  const armL = new G.Group(); armL.position.set(-0.34, 1.35, 0); g.add(armL);
  const armR = new G.Group(); armR.position.set(0.34, 1.35, 0); g.add(armR);
  armL.add(at(mesh(cyl(0.07, 0.07, 0.6, 5), o.suit ? 0xf4f4f8 : dress), 0, -0.28, 0));
  armR.add(at(mesh(cyl(0.07, 0.07, 0.6, 5), o.suit ? 0xf4f4f8 : dress), 0, -0.28, 0));
  armL.add(at(mesh(ico(0.08), skin), 0, -0.6, 0));
  armR.add(at(mesh(ico(0.08), skin), 0, -0.6, 0));
  armL.rotation.z = -0.35; armR.rotation.z = 0.35;
  const head = new G.Group(); head.position.set(0, 1.75, 0); g.add(head);
  head.add(mesh(ico(0.31, 1), skin));
  head.add(at(mesh(ico(0.06), 0xf2a98a), 0, -0.02, 0.3));
  if (o.glasses) {
    [-0.12, 0.12].forEach((x) => head.add(at(mesh(new G.TorusGeometry(0.085, 0.022, 4, 8), 0x2b2140), x, 0.06, 0.28)));
    [-0.12, 0.12].forEach((x) => head.add(at(mesh(sph(0.03), 0x2b2140), x, 0.06, 0.29)));
  } else if (o.sunglasses) {
    [-0.12, 0.12].forEach((x) => head.add(at(mesh(box(0.17, 0.09, 0.04), 0x2b2140), x, 0.06, 0.29)));
  } else {
    head.add(at(googly(0.07), -0.12, 0.07, 0.25));
    head.add(at(googly(0.07), 0.12, 0.07, 0.25));
  }
  const mouth = at(mesh(box(0.14, 0.045, 0.03), 0x7a2b3b), 0, -0.15, 0.28); head.add(mouth);
  if (o.hat === 'scarf') {
    head.add(at(mesh(cone(0.38, 0.42, 7), o.hatColor ?? 0xff4d4d), 0, 0.2, -0.02));
    head.add(at(mesh(box(0.66, 0.13, 0.5), o.hatColor ?? 0xff4d4d), 0, 0.04, -0.05));
    head.add(at(mesh(new G.TetrahedronGeometry(0.12), o.hatColor ?? 0xff4d4d), 0, -0.3, -0.05));
  } else if (o.hat === 'sunhat') {
    head.add(at(mesh(cyl(0.62, 0.62, 0.04, 10), 0xf2d48a), 0, 0.2, 0));
    head.add(at(mesh(cyl(0.24, 0.28, 0.22, 8), 0xf2d48a), 0, 0.32, 0));
    head.add(at(mesh(cyl(0.285, 0.285, 0.06, 8), 0xff4d6d), 0, 0.25, 0));
  } else if (o.hat === 'ushanka') {
    head.add(at(mesh(box(0.66, 0.3, 0.66), 0x6b4a2b), 0, 0.27, 0));
    head.add(at(mesh(box(0.1, 0.34, 0.42), 0x6b4a2b), -0.34, 0.02, 0));
    head.add(at(mesh(box(0.1, 0.34, 0.42), 0x6b4a2b), 0.34, 0.02, 0));
    head.add(at(mesh(box(0.5, 0.12, 0.08), 0x8a6a4b), 0, 0.3, 0.33));
  } else if (o.hat === 'helmet') {
    const h = mesh(ico(0.46, 1), 0xbfefff, { transparent: true, opacity: 0.35, roughness: 0.1 });
    h.castShadow = false;
    head.add(h);
    head.add(at(mesh(cyl(0.4, 0.4, 0.12, 8), 0xf4f4f8), 0, -0.4, 0));
  }
  if (o.beard) head.add(rot(at(mesh(cone(0.24, 0.38, 6), 0xffffff), 0, -0.27, 0.1), Math.PI, 0, 0));
  g.userData = { head, mouth, armL, armR };
  return g;
}

function makeTree(s = 1, color = 0x5fae55) {
  const g = new G.Group();
  g.add(at(mesh(cyl(0.12 * s, 0.16 * s, 1 * s, 5), 0x8a5a2b), 0, 0.5 * s, 0));
  g.add(at(mesh(cone(0.9 * s, 1.6 * s, 6), color), 0, 1.6 * s, 0));
  g.add(at(mesh(cone(0.7 * s, 1.2 * s, 6), color), 0, 2.4 * s, 0));
  return g;
}
function makePalm(s = 1) {
  const g = new G.Group();
  for (let i = 0; i < 5; i++) g.add(rot(at(mesh(cyl(0.12 * s, 0.15 * s, 0.7 * s, 5), 0xb8783f), i * 0.08 * s, 0.35 * s + i * 0.65 * s, 0), 0, 0, -0.06));
  for (let i = 0; i < 6; i++) {
    const a = i / 6 * Math.PI * 2;
    const leaf = mesh(box(1.4 * s, 0.05, 0.35 * s), 0x5fae55);
    leaf.position.set(0.4 * s + Math.cos(a) * 0.6 * s, 3.4 * s, Math.sin(a) * 0.6 * s);
    leaf.rotation.set(0, -a, -0.4);
    g.add(leaf);
  }
  return g;
}
function makeHouse(s = 1, wall = 0xffffff, roof = 0xff4d4d) {
  const g = new G.Group();
  g.add(at(mesh(box(2.4 * s, 1.8 * s, 2 * s), wall), 0, 0.9 * s, 0));
  const r = rot(at(mesh(cone(1.9 * s, 1.3 * s, 4), roof), 0, 2.45 * s, 0), 0, Math.PI / 4, 0);
  g.add(r);
  g.add(at(mesh(box(0.6 * s, 0.6 * s, 0.05), 0x8edceb), -0.5 * s, 1.1 * s, 1.01 * s));
  g.add(at(mesh(box(0.5 * s, 1.0 * s, 0.05), 0xb8783f), 0.6 * s, 0.5 * s, 1.01 * s));
  return g;
}
function makeFence(len = 4) {
  const g = new G.Group();
  for (let x = 0; x <= len; x += 0.8) g.add(at(mesh(box(0.15, 0.9, 0.1), 0xd99a60), x, 0.45, 0));
  g.add(at(mesh(box(len + 0.2, 0.12, 0.08), 0xb8783f), len / 2, 0.65, 0.05));
  g.add(at(mesh(box(len + 0.2, 0.12, 0.08), 0xb8783f), len / 2, 0.3, 0.05));
  return g;
}
function makePigeon() {
  const g = new G.Group();
  const b = mesh(ico(0.24), 0x9aa5b8); b.scale.set(1.3, 0.9, 0.9); g.add(b);
  g.add(at(mesh(ico(0.14), 0x9aa5b8), 0.26, 0.24, 0));
  g.add(at(mesh(ico(0.08), 0x7bc9a0), 0.2, 0.12, 0.08));
  g.add(rot(at(mesh(cone(0.04, 0.1, 4), 0xffb627), 0.42, 0.22, 0), 0, 0, -Math.PI / 2));
  g.add(at(googly(0.05), 0.3, 0.29, 0.1));
  g.add(rot(at(mesh(cone(0.1, 0.25, 4), 0x7a8598), -0.32, 0.08, 0), 0, 0, 1.2));
  g.add(at(mesh(cyl(0.02, 0.02, 0.2, 4), 0xff8a3d), 0.0, -0.28, 0.05));
  return g;
}
function makeGlove() {
  const g = new G.Group();
  g.add(at(mesh(box(0.7, 3, 0.7), 0x2b5aa0), 0, 2.2, 0));
  g.add(at(mesh(box(1.6, 1.0, 1.0), 0xffd166), 0, 0.3, 0));
  [-0.55, -0.18, 0.18, 0.55].forEach((x) => g.add(at(mesh(box(0.3, 0.7, 0.4), 0xffd166), x, -0.5, 0.2)));
  g.add(rot(at(mesh(box(0.3, 0.6, 0.4), 0xffd166), -0.9, 0.1, 0.2), 0, 0, 0.6));
  return g;
}
function makePlane() {
  const g = new G.Group();
  g.add(rot(mesh(cyl(0.6, 0.5, 6, 8), 0xffffff), 0, 0, Math.PI / 2));
  g.add(rot(at(mesh(cone(0.6, 1.2, 8), 0xffffff), 3.6, 0, 0), 0, 0, -Math.PI / 2));
  g.add(at(mesh(box(1.6, 0.1, 6), 0xe3eefa), 0, -0.1, 0));
  g.add(at(mesh(box(1.0, 1.4, 0.1), 0xff6b35), -2.7, 0.8, 0));
  return g;
}
function makeBoxCrate(s = 0.8) {
  const g = new G.Group();
  g.add(mesh(box(s, s, s), 0xd9a066));
  g.add(at(mesh(box(s + 0.01, 0.1, 0.12), 0xc28a50), 0, s / 2 - 0.05, 0));
  return g;
}
function makeFlag() {
  const g = new G.Group();
  g.add(at(mesh(cyl(0.06, 0.06, 4, 5), 0xffffff), 0, 2, 0));
  g.add(at(mesh(box(1.4, 0.9, 0.05), 0xff6b35), 0.7, 3.5, 0));
  g.add(at(mesh(box(0.45, 0.3, 0.06), 0xffffff), 0.4, 3.65, 0));
  g.add(at(mesh(box(0.45, 0.3, 0.06), 0xffffff), 1.1, 3.35, 0));
  return g;
}
function makeRock(s = 1, color = 0x9aa5b8) {
  const m = mesh(new G.DodecahedronGeometry(s, 0), color);
  m.scale.y = 0.6;
  return m;
}

function makeDoor(h = 4.6, color = 0xff6b35) {
  const g = new G.Group();
  g.add(at(mesh(box(0.5, h, 2.4), color), 0, h / 2, 0));
  for (let y = 0.4; y < h; y += 0.9) g.add(at(mesh(box(0.52, 0.35, 2.42), 0xffffff), 0, y, 0));
  return g;
}
function makePost(h = 5.2) {
  const g = new G.Group();
  g.add(at(mesh(box(0.35, h, 0.35), 0x5a4e73), 0, h / 2, 0));
  g.add(at(mesh(ico(0.25), 0xff3b3b, { emissive: 0xff2200, emissiveIntensity: 0.6 }), 0, h + 0.1, 0));
  return g;
}
function makeSack(color = 0xb8783f) {
  const g = new G.Group();
  const s = mesh(ico(0.75, 1), color); s.scale.set(1, 1.15, 1); g.add(s);
  g.add(at(mesh(cone(0.3, 0.4, 6), color), 0, 0.9, 0));
  g.add(at(googly(0.16), -0.2, 0.25, 0.62));
  g.add(at(googly(0.16), 0.2, 0.28, 0.62));
  return g;
}
function makeSpring() {
  const g = new G.Group();
  for (let i = 0; i < 3; i++) g.add(rot(at(mesh(new G.TorusGeometry(0.55, 0.08, 4, 10), 0x9aa5b8), 0, 0.15 + i * 0.18, 0), Math.PI / 2, 0, 0));
  g.add(at(mesh(cyl(0.8, 0.8, 0.14, 10), 0xff3b3b), 0, 0.65, 0));
  return g;
}
function makeBoost(len = 3) {
  const g = new G.Group();
  for (let x = -len / 2 + 0.5; x < len / 2; x += 0.9) {
    const a = new G.Shape();
    a.moveTo(0, 0.5); a.lineTo(0.45, 0); a.lineTo(0, -0.5); a.lineTo(-0.25, -0.5); a.lineTo(0.2, 0); a.lineTo(-0.25, 0.5);
    const m = new G.Mesh(new G.ShapeGeometry(a), M(0xffd166, { emissive: 0xffa000, emissiveIntensity: 0.5 }));
    m.rotation.x = -Math.PI / 2;
    m.position.set(x, 0.03, 0);
    m.scale.set(1.4, 2.2, 1);
    g.add(m);
  }
  return g;
}
function makeSticker(color = 0xffd166) {
  const st = new G.Shape();
  for (let i = 0; i < 10; i++) { const r = i % 2 ? 0.2 : 0.45; const a = i / 10 * Math.PI * 2 + Math.PI / 2; const x = Math.cos(a) * r, y = Math.sin(a) * r; i ? st.lineTo(x, y) : st.moveTo(x, y); }
  const geo = new G.ExtrudeGeometry(st, { depth: 0.12, bevelEnabled: false });
  geo.center();
  const m = new G.Mesh(geo, M(color, { emissive: 0xffa000, emissiveIntensity: 0.35 }));
  m.castShadow = true;
  return m;
}
function makePennant(color) {
  const g = new G.Group();
  g.add(at(mesh(cyl(0.03, 0.03, 1.2, 4), 0xffffff), 0, 0.6, 0));
  const f = mesh(cone(0.25, 0.7, 3), color);
  f.rotation.z = -Math.PI / 2;
  f.position.set(0.35, 1.0, 0);
  g.add(f);
  return g;
}

}

// ---------- частицы и летающие штуки ----------
const partGeo = new THREE.TetrahedronGeometry(1);
function burst(pos, color, n = 10, speed = 3, size = 0.07, parent = scene) {
  for (let i = 0; i < n; i++) {
    const m = new THREE.Mesh(partGeo, M(color));
    const s = size * rnd(0.6, 1.4);
    m.scale.setScalar(s);
    m.position.copy(pos);
    parent.add(m);
    parts.push({ m, s, parent, v: new THREE.Vector3(rnd(-1, 1) * speed, rnd(0.3, 1.2) * speed, rnd(-1, 1) * speed), life: rnd(0.6, 1.2), max: 1.2 });
  }
}
function flyBallistic(obj, v, w, ground = null, onLand = null) { flyers.push({ type: 'b', obj, v, w, ground, onLand }); }
function flyTo(obj, to, dur, h, onDone) { flyers.push({ type: 't', obj, from: obj.position.clone(), to, dur, h, t: 0, onDone, spin: rnd(4, 9) }); }

function updateFlyers(dt) {
  for (let i = flyers.length - 1; i >= 0; i--) {
    const f = flyers[i];
    if (f.type === 'b') {
      f.v.y -= 14 * dt;
      f.obj.position.addScaledVector(f.v, dt);
      f.obj.rotation.x += f.w.x * dt; f.obj.rotation.y += f.w.y * dt; f.obj.rotation.z += f.w.z * dt;
      if (f.ground !== null && f.obj.position.y < f.ground) {
        f.obj.position.y = f.ground;
        f.v.y *= -0.35; f.v.x *= 0.5; f.v.z *= 0.5; f.w.multiplyScalar(0.4);
        if (Math.abs(f.v.y) < 1) {
          f.obj.rotation.x = 0; f.obj.rotation.z = 0;
          flyers.splice(i, 1);
          if (f.onLand) f.onLand();
        }
      } else if (f.ground === null && f.obj.position.y < -30) {
        f.obj.parent && f.obj.parent.remove(f.obj);
        flyers.splice(i, 1);
      }
    } else {
      f.t += dt;
      const k = Math.min(1, f.t / f.dur);
      f.obj.position.lerpVectors(f.from, f.to, k);
      f.obj.position.y += Math.sin(k * Math.PI) * f.h;
      f.obj.rotation.y += f.spin * dt * (1 - k);
      if (k >= 1) { flyers.splice(i, 1); if (f.onDone) f.onDone(); }
    }
  }
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.v.y -= 9 * dt;
    p.m.position.addScaledVector(p.v, dt);
    p.m.rotation.x += dt * 6; p.m.rotation.y += dt * 4;
    p.life -= dt;
    p.m.scale.setScalar(p.s * Math.max(0, Math.min(1, p.life * 2)));
    if (p.life <= 0) { p.parent.remove(p.m); parts.splice(i, 1); }
  }
}

// ---------- предметы ----------
let uid = 0;
function newInst(id) {
  const mesh = makeItemMesh(id);
  mesh.traverse((o) => { if (o.isMesh) o.layers.enable(1); });
  return { uid: uid++, id, def: ITEMS[id], mesh, body: null, inBag: false, lost: false, broken: false, sx: 1, sy: 1, sz: 1, t: rnd(1, 3), yaw: 0, lie: 0, prot: 1 };
}
function bag() { return S.insts.filter((i) => i.inBag && !i.lost); }

function addBody(inst, pos, quat) {
  const d = inst.def;
  let shape;
  if (inst.broken) {
    shape = new CANNON.Box(new CANNON.Vec3(d.size.x * 0.42, 0.08, d.size.z * 0.42));
  } else if (d.shape === 'sphere') {
    shape = new CANNON.Sphere(Math.max(d.size.x, d.size.y, d.size.z) / 2 * 0.95 * Math.max(inst.sx, inst.sy, inst.sz));
  } else {
    shape = new CANNON.Box(new CANNON.Vec3(d.size.x * inst.sx * 0.48, d.size.y * inst.sy * 0.48, d.size.z * inst.sz * 0.48));
  }
  const b = new CANNON.Body({ mass: d.mass, shape, material: d.soft ? MAT.soft : MAT.item, linearDamping: 0.08, angularDamping: 0.25 });
  b.position.copy(pos);
  if (quat) b.quaternion.copy(quat);
  b.userData = { inst };
  b.addEventListener('collide', (e) => onItemCollide(inst, e));
  inst.body = b;
  S.inner.addBody(b);
  return b;
}
function removeBody(inst) { if (inst.body) { S.inner.removeBody(inst.body); inst.body = null; } }
function halfY(inst) {
  if (inst.broken) return 0.08;
  const d = inst.def;
  if (d.shape === 'sphere') return Math.max(d.size.x, d.size.y, d.size.z) / 2 * 0.95;
  return d.size.y * inst.sy * 0.48;
}

const SHARD = { cake: 0xff9ec4, teapot: 0xffffff, guitar: 0xd99a60, borscht: 0xc0304a, egg: 0xffd166 };
function breakItem(inst) {
  if (inst.broken || inst.lost) return;
  inst.broken = true;
  S.stats.broken++;
  sfx.crash();
  haptic('heavy');
  toast(inst.def.broke || 'Дзынь!');
  S.post.push(() => {
    const b = inst.body;
    if (!b) return;
    const pos = b.position.clone();
    removeBody(inst);
    inst.mesh.userData.inner.visible = false;
    const sh = makeShards(SHARD[inst.id] || 0xffffff, inst.def.size.x, inst.def.size.z);
    sh.traverse((o) => { if (o.isMesh) o.layers.enable(1); });
    inst.mesh.add(sh);
    inst.mesh.scale.set(1, 1, 1);
    pos.y = Math.max(0.1, pos.y - 0.1);
    addBody(inst, pos, new CANNON.Quaternion());
    const wp = inst.mesh.getWorldPosition(new THREE.Vector3());
    burst(wp, SHARD[inst.id] || 0xffffff, 12, 3, 0.07);
  });
}

function onItemCollide(inst, e) {
  const v = Math.abs(e.contact.getImpactVelocityAlongNormal());
  if (inst.def.squeak && v > 1.4) sfx.squeak();
  if (S.phase !== 'journey' && S.phase !== 'arrive') return;
  const other = e.body && e.body.userData && e.body.userData.inst;
  if (other && other.def.soft) return; // подушка и кот спасают хрупкое
  if (inst.def.fragile && !inst.broken && v > inst.def.thr * inst.prot) breakItem(inst);
  if (other && other.def.fragile && !other.broken && !inst.def.soft && v > other.def.thr * 1.15 * other.prot) breakItem(other);
}

function makeInner(g) {
  const w = new CANNON.World({ gravity: new CANNON.Vec3(0, -g, 0) });
  w.solver.iterations = 10;
  w.defaultContactMaterial.friction = 0.5;
  w.defaultContactMaterial.restitution = 0.12;
  [MAT.item, MAT.wall, MAT.soft].forEach((m) => w.addContactMaterial(new CANNON.ContactMaterial(MAT.soft, m, { friction: 0.7, restitution: 0 })));
  const walls = new CANNON.Body({ mass: 0, material: MAT.wall });
  const th = 1, hh = 4;
  walls.addShape(new CANNON.Box(new CANNON.Vec3(W / 2 + th, th / 2, D / 2 + th)), new CANNON.Vec3(0, -th / 2, 0));
  walls.addShape(new CANNON.Box(new CANNON.Vec3(th / 2, hh, D / 2 + th)), new CANNON.Vec3(-W / 2 - th / 2, hh, 0));
  walls.addShape(new CANNON.Box(new CANNON.Vec3(th / 2, hh, D / 2 + th)), new CANNON.Vec3(W / 2 + th / 2, hh, 0));
  walls.addShape(new CANNON.Box(new CANNON.Vec3(W / 2 + th, hh, th / 2)), new CANNON.Vec3(0, hh, D / 2 + th / 2));
  walls.addShape(new CANNON.Box(new CANNON.Vec3(W / 2 + th, hh, th / 2)), new CANNON.Vec3(0, hh, -D / 2 - th / 2));
  w.addBody(walls);
  S.walls = walls;
  return w;
}
function addCeiling() {
  S.walls.addShape(new CANNON.Box(new CANNON.Vec3(W / 2 + 1, 0.5, D / 2 + 1)), new CANNON.Vec3(0, H + 0.5, 0));
  S.walls.updateBoundingRadius();
  S.walls.aabbNeedsUpdate = true;
}

function syncItems() {
  for (const inst of S.insts) {
    if (!inst.inBag || inst.lost || !inst.body) continue;
    inst.mesh.position.copy(inst.body.position);
    inst.mesh.quaternion.copy(inst.body.quaternion);
  }
}

// ---------- живые предметы ----------
function aliveTick(dt) {
  for (const inst of bag()) {
    const b = inst.body;
    if (!b || inst.broken || (S.held && S.held.inst === inst)) continue;
    const a = inst.def.alive;
    if (!a) continue;
    inst.t -= dt;
    if (inst.t > 0) continue;
    const wp = () => inst.mesh.getWorldPosition(new THREE.Vector3());
    if (a === 'hop') {
      inst.t = rnd(2.2, 4.5);
      b.velocity.y += rnd(3, 4.5) * Math.sqrt(S.inner.gravity.length() / 9.8 + 0.2);
      b.velocity.x += rnd(-1, 1) * 1.5;
      b.velocity.z += rnd(-1, 1) * 1.2;
      b.angularVelocity.y += rnd(-4, 4);
      sfx.cluck();
      burst(wp(), 0xffffff, 5, 1.6, 0.05);
    } else if (a === 'flop') {
      inst.t = rnd(1.2, 3);
      b.velocity.y += 2.4;
      b.angularVelocity.set(rnd(-10, 10), rnd(-6, 6), rnd(-10, 10));
      burst(wp(), 0x8edceb, 4, 1.2, 0.04);
    } else if (a === 'gnome') {
      inst.t = rnd(4, 7);
      if (S.phase === 'pack' && S.held) continue;
      const q = new CANNON.Quaternion();
      q.setFromEuler(0, rnd(0, Math.PI * 2), 0);
      b.quaternion.copy(q);
      sfx.puff();
      burst(wp(), 0xffffff, 8, 1.5, 0.06);
    } else if (a === 'cat') {
      inst.t = rnd(3, 6);
      const fish = bag().find((i) => i.id === 'fish' && i.body);
      if (fish) {
        const d = fish.body.position.vsub(b.position);
        d.y = 0;
        const L = d.length() || 1;
        b.velocity.x += d.x / L * 3; b.velocity.z += d.z / L * 3; b.velocity.y += 2.5;
        sfx.meow();
        if (Math.random() < 0.4) toast('Кот охотится на рыбу!', 1.2);
      }
    }
  }
}

// ---------- 1. УПАКОВКА: клиент кидает вещи по одной ----------
const THROW_LINES = ['И ещё вот это!', 'Ой, чуть не забыла!', 'Это обязательно!', 'Без этого никак!', 'Положи-ка и это!', 'Сверху, сверху!'];
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function startLevel(i) {
  resetLevel();
  S.li = i;
  S.L = LEVELS[i];
  S.phase = 'pack';
  clearEnv();
  buildRoom();
  S.inner = makeInner(S.L.packGravity);
  const sc = makeSuitcase(W, D, H, T, LIDH);
  S.sc = sc;
  S.suit = sc.group;
  S.env.add(sc.group);
  sc.lidPivot.rotation.x = LID_OPEN;
  S.lidAngle = LID_OPEN;
  // очередь: сначала то, что просили, вперемешку с «подсунутым»
  const main = shuffle(S.L.items.map((id) => newInst(id)));
  const extra = S.L.extras.map((id) => { const x = newInst(id); x.extra = true; return x; });
  const q = [];
  main.forEach((m, k) => { q.push(m); if (k % 2 === 1 && extra.length) q.push(extra.shift()); });
  q.push(...extra);
  S.insts = q.slice();
  S.queue = q;
  S.stats = { falls: 0, pigeons: 0, eggs: 0, ejected: 0, broken: 0, jumps: 0, inflated: false, melted: false, squashed: 0, stickers: 0, home: 0, stomps: 0 };
  S.journeyT = 0;
  $('#levelTitle').textContent = S.L.title;
  $('#clientFace').src = FACES[i];
  $('#hint').style.opacity = 1;
  S.firstDrop = false;
  S.lidLine = makeLidLine();
  S.suit.add(S.lidLine);
  S.pack = null;
  S.packAtClose = null;
  S.checkT = 0;
  S.drag = false;
  // клиент стоит за чемоданом и кидает вещи
  S.thrower = makePerson(S.L.client);
  S.thrower.scale.setScalar(1.05);
  S.thrower.position.set(-2.6, BOT, -2.4);
  S.thrower.rotation.y = 0.5;
  S.env.add(S.thrower);
  renderOrder();
  renderQueue();
  packCheck();
  showLayers('top', 'pack');
  requestAnimationFrame(() => setViewOffset(packOffset()));
  later(0.4, () => toast('Лови вещи и укладывай ниже жёлтой линии!', 2.2));
  later(2.4, nextItem);
}
function packOffset() {
  const top = $('#checks').getBoundingClientRect().bottom;
  const bottom = window.innerHeight - $('#qpanel').getBoundingClientRect().top;
  return (bottom - top) / 2;
}

function renderQueue() {
  const nx = S.queue.slice(0, 3);

    || '<span class="qend">Последняя!</span>';

}
function renderOrder() {

  const used = {};

// ---------- управление упаковкой ----------
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const rimPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -H);
function setNdc(x, y) { ndc.x = x / window.innerWidth * 2 - 1; ndc.y = -(y / window.innerHeight) * 2 + 1; }
function pointOnRim(e) {
  const lift = e.pointerType === 'touch' ? 60 : 0;
  setNdc(e.clientX, e.clientY - lift);
  ray.setFromCamera(ndc, camera);
  const p = new THREE.Vector3();
  return ray.ray.intersectPlane(rimPlane, p) ? p : null;

// ориентация вещи: поворот вокруг вертикали (yaw) и «набок» (lie)
function orient(inst, yaw = inst.yaw, lie = inst.lie) {
  const s = inst.def.size;
  let x = s.x * inst.sx, y = s.y * inst.sy, z = s.z * inst.sz;
  if (inst.def.shape === 'sphere') { const r = Math.max(x, y, z); x = y = z = r; lie = 0; }
  if (lie) { const t = y; y = z; z = t; }
  if (Math.abs(Math.round(Math.sin(yaw))) === 1) { const t = x; x = z; z = t; }
  const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(lie ? Math.PI / 2 : 0, yaw, 0, 'YXZ'));
  return { hx: x / 2, hy: y / 2, hz: z / 2, q };
}
function fits(inst, yaw = inst.yaw, lie = inst.lie) { const o = orient(inst, yaw, lie); return o.hx <= W / 2 - 0.02 && o.hz <= D / 2 - 0.02; }
function canLie(inst) { const s = inst.def.size; return inst.def.shape !== 'sphere' && s.y > Math.min(s.x, s.z) * 1.25; }
function orientations(inst) {

  if (canLie(inst)) list.push([0, 1], [Math.PI / 2, 1]);
  return list.filter(([y, l]) => fits(inst, y, l));
}
function clampXZ(o, p) {
  const mx = Math.max(0, W / 2 - o.hx - 0.03), mz = Math.max(0, D / 2 - o.hz - 0.03);
  p.x = Math.max(-mx, Math.min(mx, p.x));
  p.z = Math.max(-mz, Math.min(mz, p.z));

}

// куда упадёт вещь: лучами вниз по её «следу»
const _rf = new CANNON.Vec3(), _rt = new CANNON.Vec3(), _rr = new CANNON.RaycastResult();
function landing(x, z, o) {
  let maxY = 0;
  for (const sx of [-1, 0, 1]) for (const sz of [-1, 0, 1]) {
    const px = x + sx * Math.max(0, o.hx - 0.05), pz = z + sz * Math.max(0, o.hz - 0.05);
    _rf.set(px, 9, pz); _rt.set(px, -0.5, pz);
    _rr.reset();
    S.inner.raycastClosest(_rf, _rt, { skipBackfaces: true }, _rr);
    if (_rr.hasHit && _rr.hitPointWorld.y > maxY) maxY = _rr.hitPointWorld.y;

}
// когда время вышло: самое низкое свободное место
function autoPlace(inst) {
  let best = null;
  for (const [yaw, lie] of orientations(inst)) {
    const o = orient(inst, yaw, lie);
    const mx = Math.max(0, W / 2 - o.hx - 0.03), mz = Math.max(0, D / 2 - o.hz - 0.03);
    for (let i = 0; i <= 6; i++) for (let j = 0; j <= 3; j++) {
      const x = -mx + (2 * mx) * i / 6, z = -mz + (2 * mz) * j / 3;
      const top = landing(x, z, o) + 2 * o.hy + Math.random() * 0.04;
      if (!best || top < best.top) best = { top, x, z, yaw, lie };
    }
  }
  if (best) { inst.yaw = best.yaw; inst.lie = best.lie; }
  return best;
}

function makeGhost() {
  return new THREE.Mesh(new THREE.BoxGeometry(1, 0.03, 1), new THREE.MeshBasicMaterial({ color: 0x7bc96f, transparent: true, opacity: 0.55, depthWrite: false }));
}
function updateGhost() {
  const h = S.held;
  if (!h) return;
  const o = orient(h.inst);
  clampXZ(o, h.target);
  const land = landing(h.target.x, h.target.z, o);
  const tooHigh = land + 2 * o.hy > H + 0.03;
  h.target.y = land + o.hy + 0.6;
  S.ghost.scale.set(o.hx * 2, 1, o.hz * 2);
  S.ghost.position.set(h.target.x, land + 0.02, h.target.z);

// следующая вещь летит из рук клиента

  const inst = S.queue.shift();
  renderQueue();
  const ops = orientations(inst);
  if (!fits(inst) && ops[0]) { inst.yaw = ops[0][0]; inst.lie = ops[0][1]; }
  inst.mesh.scale.set(inst.sx, inst.sy, inst.sz);
  inst.mesh.quaternion.copy(orient(inst).q);
  const hand = new THREE.Vector3(-2.0, 1.6, -2.0);

  S.suit.add(inst.mesh);

  S.held = { inst, target, t: 0, time: S.L.packTime, flying: true };

  S.suit.add(S.ghost);

  const ud = S.thrower.userData;

function dropHeld() {
  const h = S.held;
  if (!h) return;
  const inst = h.inst;
  const fl = flyers.findIndex((f) => f.obj === inst.mesh);
  if (fl >= 0) flyers.splice(fl, 1);
  const o = orient(inst);
  clampXZ(o, h.target);
  const land = landing(h.target.x, h.target.z, o);
  const pos = new CANNON.Vec3(h.target.x, land + o.hy + 0.1, h.target.z);
  inst.mesh.position.set(pos.x, pos.y, pos.z);
  inst.mesh.quaternion.copy(o.q);
  addBody(inst, pos, new CANNON.Quaternion(o.q.x, o.q.y, o.q.z, o.q.w));
  inst.body.velocity.set(0, -0.5, 0);
  inst.inBag = true;
  S.held = null;
  S.drag = false;

  renderOrder();
  if (!S.firstDrop) { S.firstDrop = true; $('#hint').style.opacity = 0; }
  if (inst.id === 'cat') later(0.5, () => toast('Кот лёг. Это его место.', 1.3));
  S.checkT = 0.3;

function leaveHome() {

function rotateHeld() {
  const h = S.held;
  if (!h || S.phase !== 'pack') return;
  const ops = orientations(h.inst);
  if (ops.length < 2) { toast('По-другому не влезет!', 1); return; }
  const k = ops.findIndex(([y, l]) => Math.abs(y - h.inst.yaw) < 0.01 && l === h.inst.lie);

function updateHeld(dt) {
  const h = S.held;
  if (!h) return;
  const m = h.inst.mesh;
  if (!h.flying) {
    m.position.lerp(h.target, 1 - Math.exp(-dt * 16));
    const wob = new THREE.Quaternion().setFromEuler(new THREE.Euler(Math.sin(S.time * 7) * 0.06, 0, Math.cos(S.time * 6) * 0.06));
    m.quaternion.copy(wob.multiply(orient(h.inst).q));
  }
  // таймер: не успел — вещь ложится сама

  bar.style.width = (k * 100) + '%';
  bar.style.background = k < 0.3 ? '#FF4D4D' : '#FF6B35';

// ---------- цели упаковки ----------
function packCheck() {
  const items = bag().filter((i) => i.body);
  // 1. заказ
  const need = {};
  for (const id of S.L.required) need[id] = (need[id] || 0) + 1;
  const have = {};
  for (const i of items) have[i.id] = (have[i.id] || 0) + 1;
  let got = 0;
  for (const id in need) got += Math.min(need[id], have[id] || 0);
  // 2. торчит над линией крышки
  let over = 0;
  for (const i of items) { i.over = topOf(i) > H + 0.03; if (i.over) over++; }
  // 3. хрупкое: рядом мягкое и сверху нет тяжёлого
  const fr = new Map();
  for (const i of items) if (i.def.fragile && !i.broken) { fr.set(i.body, { inst: i, soft: false, heavy: false }); }
  for (const c of S.inner.contacts) {
    for (const [a, b] of [[c.bi, c.bj], [c.bj, c.bi]]) {
      const r = fr.get(a);
      if (!r) continue;
      const o = b.userData && b.userData.inst;
      if (!o) continue;
      if (o.def.soft) r.soft = true;
      if (!o.def.soft && o.def.mass >= 1.2 && b.position.y > a.position.y + 0.12) r.heavy = true;
    }
  }
  let fragBad = 0;
  for (const i of items) i.fragBad = false;
  for (const r of fr.values()) { r.inst.fragBad = !r.soft || r.heavy; r.inst.heavyOn = r.heavy; if (r.inst.fragBad) fragBad++; }
  // 4. баланс: где центр тяжести по ширине
  let m = 0, cx = 0;
  for (const i of items) { cx += i.body.position.x * i.def.mass; m += i.def.mass; }
  const bal = m ? cx / m : 0;
  S.pack = { got, total: S.L.required.length, over, fragBad, fragTotal: fr.size, bal, count: items.length };
  renderChecks();
}
function renderChecks() {
  const p = S.pack;
  if (!p) return;
  const set = (id, ok, val) => { const el = $(id); el.classList.toggle('ok', ok); el.classList.toggle('bad', !ok); el.querySelector('b').textContent = val; };
  set('#chOrder', p.got === p.total, p.got + '/' + p.total);
  set('#chLid', p.over === 0 && p.count > 0, p.count === 0 ? '—' : p.over === 0 ? 'влезет' : 'торчит ' + p.over);
  set('#chFrag', p.fragBad === 0, p.fragTotal === 0 ? 'нет' : p.fragBad === 0 ? 'в безопасности' : 'опасно ' + p.fragBad);
  const balOk = Math.abs(p.bal) < 0.3;
  $('#chBal').classList.toggle('ok', balOk);
  $('#chBal').classList.toggle('bad', !balOk);
  $('#bub').style.left = (50 + Math.max(-1, Math.min(1, p.bal / (W / 2))) * 45) + '%';
}

function makeMarker() {
  const g = new THREE.Group();
  const red = mesh(cone(0.2, 0.42, 4), 0xff3b3b);
  red.rotation.x = Math.PI;
  const warn = new THREE.Group();
  warn.add(at(mesh(cyl(0.08, 0.08, 0.34, 5), 0xff8a00), 0, 0.14, 0));
  warn.add(at(mesh(ico(0.09), 0xff8a00), 0, -0.16, 0));
  g.add(red, warn);
  g.userData = { red, warn };
  return g;
}
function updateMarkers() {
  const show = S.phase === 'pack' || (S.phase === 'lid' && S.lid && !S.lid.done);
  for (const i of S.insts) {
    const need = show && i.inBag && !i.lost && i.body && (i.over || i.fragBad);
    if (!need) { if (i.mk) i.mk.visible = false; continue; }
    if (!i.mk) { i.mk = makeMarker(); S.suit.add(i.mk); }
    i.mk.visible = true;
    i.mk.position.set(i.body.position.x, topOf(i) + 0.35 + Math.abs(Math.sin(S.time * 4 + i.uid)) * 0.15, i.body.position.z);
    i.mk.userData.red.visible = !!i.over;
    i.mk.userData.warn.visible = !i.over && !!i.fragBad;
  }
}
function makeLidLine() {
  const g = new THREE.Group();
  const m = new THREE.MeshBasicMaterial({ color: 0xffd166 });
  const seg = 0.22, gap = 0.14;
  const addRun = (x0, z0, x1, z1) => {
    const len = Math.hypot(x1 - x0, z1 - z0);
    for (let t = 0; t < len; t += seg + gap) {
      const l = Math.min(seg, len - t);
      const k = (t + l / 2) / len;
      const s = new THREE.Mesh(new THREE.BoxGeometry(x1 !== x0 ? l : 0.05, 0.05, z1 !== z0 ? l : 0.05), m);
      s.position.set(x0 + (x1 - x0) * k, H, z0 + (z1 - z0) * k);
      g.add(s);
    }
  };
  const x = W / 2 - 0.03, z = D / 2 - 0.03;
  addRun(-x, z, x, z); addRun(-x, -z, x, -z); addRun(-x, -z, -x, z); addRun(x, -z, x, z);
  return g;
}


// ---------- 2. КРЫШКА ----------
function topOf(inst) {
  const b = inst.body;
  if (!b) return 0;
  const sh = b.shapes[0];
  if (sh instanceof CANNON.Sphere) return b.position.y + sh.radius;
  const e = sh.halfExtents;
  let m = -Infinity;
  for (const sx of [-1, 1]) for (const sy of [-1, 1]) for (const sz of [-1, 1]) {
    const v = b.quaternion.vmult(new CANNON.Vec3(sx * e.x, sy * e.y, sz * e.z));
    if (v.y > m) m = v.y;
  }
  return b.position.y + m;
}
function startLid() {
  if (S.phase !== 'pack') return;
  if (S.held) dropHeld();
  S.phase = 'lid';
  packCheck();
  S.packAtClose = { ...S.pack };
  const over = bag().filter((i) => topOf(i) > H + 0.03);
  const person = makePerson(S.L.client);
  person.scale.setScalar(1.15);
  person.position.set(0, H + 6, 0.25);
  S.env.add(person);
  S.lid = { need: over.length ? Math.min(6, 2 + over.length) : 0, taps: 0, over, person, y: H + 6, vy: 0, air: true, first: false, done: false };
  $('#lidBar').style.width = '0%';
  $('#lidText').textContent = over.length ? 'Не закрывается! Прыгай!' : 'Всё ровно — закроется само!';
  $('#jumpWrap').style.visibility = over.length ? 'visible' : 'hidden';
  showLayers('top', 'lidui');
  setViewOffset(50);
  sfx.whoosh();
}
function lidLandY() {
  const L = S.lid;
  return H + LIDH * 0.6 + (1 - lidProg()) * 0.7;
}
function lidProg() {
  const L = S.lid;
  if (!L) return 0;
  if (L.need === 0) return L.done ? 1 : 0;
  return Math.min(1, L.taps / L.need);
}
function lidTick(dt) {
  const L = S.lid;
  if (!L) return;
  if (L.air) {
    L.vy -= 24 * dt;
    L.y += L.vy * dt;
    if (L.vy < 0 && L.y <= lidLandY() && !L.exit) { L.y = lidLandY(); L.air = false; onLidLand(); }
  }
  if (L.exit) return;
  L.person.position.y = L.y;
  const ud = L.person.userData;
  const up = L.air ? 2.6 : 0.4;
  if (L.need === 0 && L.first) { ud.armL.rotation.z = -2.6; ud.armR.rotation.z = 2.6; }
  ud.armL.rotation.z += (-up - ud.armL.rotation.z) * 0.3;
  ud.armR.rotation.z += (up - ud.armR.rotation.z) * 0.3;
  ud.mouth.scale.y = L.air ? 3 : 1;
}
function onLidLand() {
  const L = S.lid;
  sfx.thud(); sfx.boing();
  haptic('heavy');
  S.shake = 0.3;
  S.squash = 1;
  if (!L.first) {
    L.first = true;
    if (L.need === 0) {
      $('#lidBar').style.width = '100%';
      later(0.15, () => toast('Щёлк! Даже прыгать не пришлось!', 1.8));
      finishLid();
    }
    return;
  }
  L.taps++;
  $('#lidBar').style.width = Math.min(100, L.taps / L.need * 100) + '%';
  burst(new THREE.Vector3(rnd(-1, 1), H + 0.6, 1.2), 0xffffff, 6, 2, 0.06);
  if (L.over.length) {
    const inst = L.over.splice(Math.floor(Math.random() * L.over.length), 1)[0];
    if (inst.def.soft) squashItem(inst);
    else if (topOf(inst) > H + 0.55 && Math.random() < 0.45) ejectItem(inst);
    else { pressDown(inst); if (topOf(inst) > H + 0.03) L.over.push(inst); }
  }
  for (const i of bag()) if (i.body) i.body.velocity.y -= 2.5;
  if (L.taps >= L.need) finishLid();
}
$('#jumpBtn').addEventListener('pointerdown', (e) => {
  e.preventDefault();
  const L = S.lid;
  if (!L || L.done || L.air || !L.first) return;
  L.vy = 9; L.air = true;
  S.stats.jumps++;
  sfx.boing();
});
function squashItem(inst) {
  const b = inst.body;
  if (!b) return;
  const bottom = b.position.y - halfY(inst);
  const cur = halfY(inst) * 2;
  const target = Math.max(0.12, H - 0.04 - bottom);
  const f = Math.max(0.3, Math.min(1, target / cur));
  if (f >= 0.99) return;
  const pos = b.position.clone();
  const q = b.quaternion.clone();
  removeBody(inst);
  inst.sy *= f;
  inst.mesh.scale.set(inst.sx, inst.sy, inst.sz);
  pos.y = bottom + halfY(inst) + 0.01;
  addBody(inst, pos, q);
  inst.mesh.position.copy(inst.body.position);
  inst.mesh.quaternion.copy(inst.body.quaternion);
  S.stats.squashed++;
  sfx.squeak();
  const lines = { cat: 'Кот сплющился. Ему нормально.', flamingo: 'Фламинго сдулся... пока что.', pillow: 'Подушку утрамбовали!', duck: 'Пи-и-и!', swimsuit: 'Купальник в лепёшку!' };
  toast(lines[inst.id] || 'Утрамбовали!', 1.3);
}
function pressDown(inst) {
  // утрамбовать: опустить вещь пониже и чуть сдвинуть
  const b = inst.body;
  if (!b) return;
  const over = topOf(inst) - (H - 0.02);
  if (over <= 0) return;
  b.position.y -= over;
  b.position.x += rnd(-0.15, 0.15);
  b.position.z += rnd(-0.1, 0.1);

// ---------- 3. ДОРОГА ----------
const THEMES = {
  village: { bg: 0x8edceb, top: 0x7bc96f, side: 0x8a5a2b, back: 0x6bb862 },
  airport: { bg: 0x2ec4b6, top: 0x9aa5b8, side: 0x5a4e73, back: 0x25a89c },
  ice: { bg: 0xbfeff6, top: 0xeaf8fc, side: 0x9fd4e6, back: 0xffffff },
  moon: { bg: 0x1b1530, top: 0xc9cfd8, side: 0x8a90a0, back: 0x9aa5b8 },
};

function groundBox(x0, x1, ytop, color, sideColor, belt = 0, mat = MAT.ground) {
  const len = x1 - x0, cx = (x0 + x1) / 2, hy = 4;
  const b = new CANNON.Body({ mass: 0, material: mat, shape: new CANNON.Box(new CANNON.Vec3(len / 2, hy, 3)) });
  b.position.set(cx, ytop - hy, 0);
  b.userData = { belt, top: ytop };
  S.outer.addBody(b);
  S.env.add(at(mesh(box(len, 0.35, 6), color), cx, ytop - 0.175, 0));
  S.env.add(at(mesh(box(len, hy * 2 - 0.35, 6), sideColor), cx, ytop - 0.35 - (hy * 2 - 0.35) / 2, 0));
  if (belt) {
    for (let x = x0 + 0.5; x < x1 - 0.3; x += 1.2) {
      const s = at(mesh(box(0.25, 0.04, 5.6), belt > 0 ? 0xffd166 : 0xff4d4d), x, ytop + 0.01, 0);
      S.env.add(s);
      S.belts.push({ m: s, x0, x1, base: x, speed: belt });
    }
  }
  return b;
}
function rampBox(x0, y0, x1, y1, color) {
  const len = Math.hypot(x1 - x0, y1 - y0);
  const ang = Math.atan2(y1 - y0, x1 - x0);
  const th = 0.6;
  const nx = -Math.sin(ang), ny = Math.cos(ang);
  const cx = (x0 + x1) / 2 - nx * th / 2, cy = (y0 + y1) / 2 - ny * th / 2;
  const b = new CANNON.Body({ mass: 0, material: MAT.ground, shape: new CANNON.Box(new CANNON.Vec3(len / 2, th / 2, 3)) });
  b.position.set(cx, cy, 0);
  b.quaternion.setFromEuler(0, 0, ang);
  b.userData = { belt: 0, top: Math.max(y0, y1) };
  S.outer.addBody(b);
  const m = rot(at(mesh(box(len, th, 6), color), cx, cy, 0), 0, 0, ang);
  S.env.add(m);
}

function addPigeon(x, y) {
  const m = makePigeon();
  m.scale.setScalar(1.3);

  const b = new CANNON.Body({ mass: 0.3, shape: new CANNON.Box(new CANNON.Vec3(0.35, 0.35, 0.3)) });
  b.position.set(x, y + 0.45, 0);
  b.linearFactor.set(1, 1, 0);
  b.angularFactor.set(0, 0, 1);
  b.userData = { pigeon: true };
  S.outer.addBody(b);
  const p = { b, m, hit: false, t: rnd(0, 3) };
  b.addEventListener('collide', (e) => {
    if (p.hit || e.body !== S.body) return;
    p.hit = true;
    S.stats.pigeons++;
    S.post.push(() => { b.velocity.set(S.body.velocity.x + 5, 9, 0); b.angularVelocity.set(0, 0, 12); });
    sfx.coo();
    toast(pick(['Курлык!', 'Голубь, прости!', 'Голубь улетел в отпуск!']), 1.3);

}
function addCrates(x, y) {

function decorate(theme, x0, x1, y) {
  const e = S.env;
  const by = y - 0.4;
  e.add(at(mesh(box(x1 - x0 + 80, 0.4, 60), THEMES[theme].back), (x0 + x1) / 2, by - 0.2, -33));
  for (let x = x0 - 10; x < x1 + 20; x += rnd(3.5, 7)) {

    } else {

    e.add(at(mesh(box(x1 - x0 + 60, 14, 0.5), 0x3bcfc1), (x0 + x1) / 2, by + 7, -18));
    for (let x = x0 - 10; x < x1 + 20; x += 9) e.add(at(mesh(box(6, 4, 0.2), 0xd8f6fa), x, by + 5, -17.7));
  }
  if (theme === 'moon') {
    const g = new THREE.BufferGeometry();
    const pts = [];
    for (let i = 0; i < 500; i++) pts.push(rnd(-150, 250), rnd(5, 90), rnd(-120, -60));
    g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
    e.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: 0.5 })));
    const earth = at(mesh(ico(7, 1), 0x5aa9e6), (x0 + x1) / 2, 32, -90);
    earth.add(at(mesh(ico(3.5, 0), 0x7bc96f), 3, 2, 4.5));
    e.add(earth);
