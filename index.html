function buildTrack(L) {
  const th = THEMES[L.theme];
  let x = 0, y = 0, minY = 0;
  const tr = { startX: 4, finishX: 0, gloves: [], triggers: [], gaps: [], doors: [], pends: [], drops: [], boosts: [], springs: [], stickers: [] };
  S.track = tr;
  S.belts = [];
  const doorColor = { village: 0xb8783f, airport: 0x2ec4b6, ice: 0x5aa9e6, moon: 0x9aa5b8 }[L.theme];
  const sackColor = { village: 0xb8783f, airport: 0x5a4e73, ice: 0xffffff, moon: 0x8a90a0 }[L.theme];
  for (const [type, a] of L.track) {
    if (type === 'flat') { groundBox(x, x + a, y, th.top, th.side); x += a; }
    else if (type === 'gap') {
      tr.gaps.push([x, x + a]);
      const hgt = 3.2 * (L.gravity < 5 ? 1.2 : 1);
      addSticker(x + a / 2, y + hgt); addSticker(x + a / 2 - 1.3, y + hgt - 0.6); addSticker(x + a / 2 + 1.3, y + hgt - 0.6);
      x += a;
    }
    else if (type === 'door') { groundBox(x, x + 6, y, th.top, th.side); addDoor(x + 3, y, doorColor); x += 6; }
    else if (type === 'pendulum') { groundBox(x, x + 7, y, th.top, th.side); addPendulum(x + 3.5, y, sackColor); x += 7; }
    else if (type === 'drop') { groundBox(x, x + a, y, th.top, th.side); tr.drops.push({ x0: x, x1: x + a, y, t: 0 }); x += a; }
    else if (type === 'boost') {
      groundBox(x, x + 4, y, th.top, th.side);
      const m = makeBoost(4); m.position.set(x + 2, y, 0); S.env.add(m);
      tr.boosts.push({ x0: x, x1: x + 4, y });
      x += 4;
    }
    else if (type === 'spring') {
      groundBox(x, x + 3, y, th.top, th.side);
      const m = makeSpring(); m.position.set(x + 1.5, y, 0); m.scale.setScalar(1.3); S.env.add(m);
      tr.springs.push({ x0: x + 0.2, x1: x + 2.8, y, m });
      const hg = L.gravity < 5 ? 1.25 : 1;
      for (let k = 0; k < 5; k++) addSticker(x + 2 + k * 1.5, y + (5.5 - Math.abs(k - 2) * 0.7) * hg);
      x += 3;
    }
    else if (type === 'reverse') { groundBox(x, x + a, y, 0x3a3150, 0x2b2140, -5); x += a; }
    else if (type === 'slick') {
      groundBox(x, x + a, y, th.top, th.side, 0, MAT.slick);
      S.env.add(at(mesh(box(a - 0.4, 0.05, 5.2), 0x8edceb, { roughness: 0.1 }), x + a / 2, y + 0.03, 0));
      x += a;
    }
    else if (type === 'sticker') { for (let k = 0; k < 4; k++) addSticker(x + 1 + k * 1.3, y + 1.6); }
    else if (type === 'bump') { groundBox(x, x + 4, y, th.top, th.side); rampBox(x + 0.5, y, x + 2, y + 0.55, th.top); rampBox(x + 2, y + 0.55, x + 3.5, y, th.top); x += 4; }
    else if (type === 'up') { const l = Math.max(3, a * 2.6); groundBox(x, x + l, y, th.top, th.side); rampBox(x, y, x + l, y + a, th.top); y += a; x += l; }
    else if (type === 'down') { const l = Math.max(3, a * 2.6); groundBox(x, x + l, y - a, th.top, th.side); rampBox(x, y, x + l, y - a, th.top); y -= a; x += l; }
    else if (type === 'belt') { groundBox(x, x + a, y, 0x3a3150, 0x2b2140, 5); x += a; }
    else if (type === 'pigeon') { groundBox(x, x + 3, y, th.top, th.side); addPigeon(x + 1.5, y); x += 3; }
    else if (type === 'boxes') { groundBox(x, x + 5, y, th.top, th.side); addCrates(x + 2, y); x += 5; }
    else if (type === 'glove') {
      groundBox(x, x + 6, y, L.theme === 'airport' ? 0x3a3150 : th.top, th.side);
      const g = makeGlove(); g.position.set(x + 1.6, y + 9, 0.3); S.env.add(g);
      tr.gloves.push({ x: x + 1.2, y, m: g, done: false, t: -1 });
      x += 6;
    }
    else if (type === 'inflate') tr.triggers.push({ x, type: 'inflate', done: false });
    else if (type === 'finish') {
      groundBox(x, x + 14, y, th.top, th.side);
      const f = makeFlag(); f.position.set(x + 4, y, -2.4); S.env.add(f);
      const f2 = makeFlag(); f2.position.set(x + 4, y, 2.4); S.env.add(f2);
      tr.finishX = x + 4;
      x += 14;
    }
    minY = Math.min(minY, y);
  }
  tr.minY = minY;
  tr.endX = x;
  decorate(L.theme, 0, x, minY);
  return tr;
}

// ---------- гонка: соперники и препятствия ----------
function groundInfo(b) {
  for (const c of S.outer.contacts) {
    if (c.bi !== b && c.bj !== b) continue;
    const ny = c.bi === b ? -c.ni.y : c.ni.y;
    if (ny > 0.5) {
      const gb = c.bi === b ? c.bj : c.bi;
      return { ok: true, gb, belt: (gb.userData && gb.userData.belt) || 0 };
    }
  }
  return { ok: false, gb: null, belt: 0 };
}
function uprightTorque(b, grounded) {
  const ang = 2 * Math.atan2(b.quaternion.z, b.quaternion.w);
  const a = Math.atan2(Math.sin(ang), Math.cos(ang));
  const e = a > 0.5 ? a - 0.5 : a < -0.5 ? a + 0.5 : 0;
  if (Math.abs(a) < 1.4) b.torque.z += (-e * (grounded ? 90 : 30) - b.angularVelocity.z * (grounded ? 4 : 1.5)) * (b.mass / 10);
}
// ускорители и батуты работают для всех чемоданов
function padsFor(b, st, grounded) {
  const x = b.position.x;
  for (const p of S.track.boosts) {
    if (grounded && x > p.x0 && x < p.x1) {
      b.velocity.x = Math.max(b.velocity.x, 13.5);
      st.boostT = 0.7;
      if (st === S && !p.said) { p.said = true; toast('Ж-ж-ж!', 0.7); sfx.whoosh(); haptic('medium'); }
    }
  }
  for (const p of S.track.springs) {
    if (x > p.x0 && x < p.x1 && b.position.y - HALF_Y < p.y + 1.0 && b.velocity.y <= 0.5 && (st.springCd || 0) <= 0) {
      b.velocity.y = 12.5 * Math.sqrt(S.g / 9.8);
      st.springCd = 0.6;
      p.t = 0.25;
      sfx.boing();
      if (st === S) haptic('medium');
    }
  }
}
function addDoor(x, y, color) {
  S.env.add(at(makePost(), x, y, 2.4));
  S.env.add(at(makePost(), x, y, -2.4));
  const door = makeDoor(4.8, color);
  S.env.add(door);
  const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.3, 8, 6), new THREE.MeshStandardMaterial({ color: 0x7bc96f, emissive: 0x2ec400, emissiveIntensity: 0.9 }));
  lamp.position.set(x, y + 5.7, 2.4);
  S.env.add(lamp);
  const b = new CANNON.Body({ mass: 0, type: CANNON.Body.KINEMATIC, shape: new CANNON.Box(new CANNON.Vec3(0.25, 2.4, 1.2)) });
  b.position.set(x, y + 2.4, 0);
  S.outer.addBody(b);
  S.track.doors.push({ x, y, b, m: door, lamp, period: rnd(3.4, 4.0), ph: rnd(0, 4), open: 1 });
}
function doorOpen(d, t) {
  // цикл: открыто — закрывается — закрыто — открывается
  const p = ((t + d.ph) % d.period) / d.period;
  if (p < 0.45) return 1;
  if (p < 0.53) return 1 - (p - 0.45) / 0.08;
  if (p < 0.92) return 0;
  return (p - 0.92) / 0.08;
}
function addPendulum(x, y, color) {
  const pivot = new THREE.Vector3(x, y + 7.6, 0);
  S.env.add(at(mesh(box(0.3, 7.8, 0.3), 0x8a5a2b), x, y + 3.9, -2.6));
  S.env.add(at(mesh(box(0.4, 0.4, 5.6), 0x8a5a2b), x, y + 7.8, 0));
  const sack = makeSack(color);
  S.env.add(sack);
  const rope = mesh(cyl(0.05, 0.05, 1, 4), 0x6b4a2b);
  S.env.add(rope);
  const b = new CANNON.Body({ mass: 0, type: CANNON.Body.KINEMATIC, shape: new CANNON.Sphere(0.85) });
  b.userData = { pendulum: true };
  S.outer.addBody(b);
  S.track.pends.push({ pivot, L: 5.0, b, sack, rope, w: rnd(1.7, 2.1), ph: rnd(0, 6) });
}
function addSticker(x, y) {
  const m = makeSticker(pick([0xffd166, 0xff7eb6, 0x8edceb, 0x7bc96f]));
  m.position.set(x, y, 0.4);
  S.env.add(m);
  S.track.stickers.push({ m, x, y, got: false });
}
function addRival(cfg, x, y, skill) {
  const sc = makeSuitcase(W, D, H, T, LIDH, cfg.pal);
  const pn = makePennant(cfg.flag); pn.position.set(-1.1, TOP, 0); sc.group.add(pn);
  sc.group.add(at(googly(0.24), -0.45, H * 0.72, D / 2 + T + 0.12));
  sc.group.add(at(googly(0.24), 0.45, H * 0.72, D / 2 + T + 0.12));
  S.env.add(sc.group);
  const b = new CANNON.Body({ mass: 8, material: MAT.suit, shape: new CANNON.Box(new CANNON.Vec3(W / 2 + T, HALF_Y, D / 2 + T)), linearDamping: 0.05, angularDamping: 0.35 });
  b.linearFactor.set(1, 1, 0);
  b.angularFactor.set(0, 0, 1);
  b.position.set(x, y + HALF_Y + 0.3, 0);
  S.outer.addBody(b);
  const r = { cfg, b, g: sc.group, speed: 8.5 * rnd(0.86, 0.97), skill: Math.min(0.97, skill * rnd(0.92, 1.08)), stun: 0, safe: { x, y }, dec: new Map(), coyote: 0, stuckT: 0, finished: false, boostT: 0, springCd: 0, saidT: 0 };
  b.userData = { rival: r };
  S.rivals.push(r);
}
function rivalTick(r, dt) {
  const b = r.b;
  const g = S.g;
  const gi = groundInfo(b);
  if (gi.ok) r.coyote = 0.15; else r.coyote -= dt;
  r.stun -= dt; r.boostT -= dt; r.springCd -= dt; r.saidT -= dt;
  const go = S.phase === 'journey' && S.countdown <= 0 && r.stun <= 0;
  if (go) {
    let cap = r.boostT > 0 ? 13.5 : r.speed;
    if (gi.belt < 0) cap += gi.belt * 0.6;
    if (b.velocity.x < cap) b.force.x += (gi.ok ? 14 : 5) * b.mass;
    if (gi.belt > 0 && b.velocity.x < gi.belt) b.force.x += 9 * b.mass;
    if (gi.belt < 0) b.force.x += gi.belt * 1.5 * b.mass;
    const x = b.position.x;
    const jump = () => { b.velocity.y = 7.2 * Math.sqrt(g / 9.8); r.coyote = 0; };
    for (const [a0] of S.track.gaps) {
      if (r.coyote > 0 && x > a0 - 3.4 && x < a0 - 1.0) {
        let d = r.dec.get(a0);
        if (d === undefined) { d = Math.random() < r.skill; r.dec.set(a0, d); }
        if (d) jump();
      }
    }
    // упёрся во что-то — пробует перепрыгнуть
    if (gi.ok && b.velocity.x < 1.2) r.stuckT += dt; else r.stuckT = 0;
    if (r.stuckT > 0.7 && r.coyote > 0) { r.stuckT = 0; jump(); }
  }
  uprightTorque(b, gi.ok);
  padsFor(b, r, gi.ok);
  if (gi.ok && Math.abs(b.velocity.y) < 2) r.safe = { x: b.position.x, y: b.position.y - HALF_Y };
  if (b.position.y < S.track.minY - 9) {
    b.position.set(r.safe.x - 2, r.safe.y + HALF_Y + 1.5, 0);
    b.velocity.set(0, 0, 0); b.angularVelocity.set(0, 0, 0); b.quaternion.set(0, 0, 0, 1);
    r.stun = 0.8;
    if (Math.abs(b.position.x - S.body.position.x) < 25 && S.saidT <= 0) { toast(r.cfg.name + ' нырнул!', 1.2); S.saidT = 2.5; }
  }
  const up = b.quaternion.vmult(new CANNON.Vec3(0, 1, 0));
  if (up.y < 0.35 && b.velocity.length() < 2.5) { r.upT = (r.upT || 0) + dt; if (r.upT > 1.2) { r.upT = 0; b.quaternion.set(0, 0, 0, 1); b.position.y += 1.4; b.angularVelocity.set(0, 0, 0); } } else r.upT = 0;
  if (!r.finished && b.position.x > S.track.finishX) { r.finished = true; S.finishOrder.push(r); }
}
function placeNow() {
  const px = S.body.position.x;
  let ahead = S.finishOrder.length;
  for (const r of S.rivals) if (!r.finished && r.b.position.x > px) ahead++;
  return ahead + 1;
}
function obstaclesTick(dt) {
  const t = S.raceT;
  for (const d of S.track.doors) {
    const o = doorOpen(d, t);
    const z = -o * 3.4;
    d.b.velocity.set(0, 0, (z - d.b.position.z) / dt);
    d.b.position.z = z;
    d.open = o;
  }
  for (const p of S.track.pends) {
    const a = 1.15 * Math.sin(t * p.w + p.ph);
    const x = p.pivot.x + Math.sin(a) * p.L, y = p.pivot.y - Math.cos(a) * p.L;
    p.b.velocity.set((x - p.b.position.x) / dt, (y - p.b.position.y) / dt, 0);
    p.b.position.set(x, y, 0);
  }
  // падающий багаж в зоне «drop»
  const px = S.body.position.x;
  for (const z of S.track.drops) {
    if (px < z.x0 - 4 || px > z.x1) continue;
    z.t -= dt;
    if (z.t <= 0 && S.falling.length < 4) {
      z.t = rnd(0.9, 1.4);
      const fx = Math.min(z.x1, Math.max(z.x0, px + S.body.velocity.x * 1.4 + rnd(-0.5, 1.2)));
      spawnFalling(fx, z.y);
    }
  }
  for (let i = S.falling.length - 1; i >= 0; i--) {
    const f = S.falling[i];
    f.life -= dt;
    if (f.warn) f.warn.material.opacity = Math.max(0, Math.min(0.7, (f.b.position.y - f.y) / 8));
    if (f.life <= 0) {
      S.outer.removeBody(f.b); S.env.remove(f.m); if (f.warn) S.env.remove(f.warn);
      S.falling.splice(i, 1);
    }
  }
}
function spawnFalling(x, y) {
  const moon = S.L.theme === 'moon';
  const m = moon ? makeRock(0.6, 0x8a90a0) : makeBoxCrate(0.9);
  S.env.add(m);
  const b = new CANNON.Body({ mass: 1.5, shape: new CANNON.Box(new CANNON.Vec3(0.45, 0.45, 0.45)) });
  b.linearFactor.set(1, 1, 0);
  b.angularFactor.set(0, 0, 1);
  b.position.set(x, y + 12, 0);
  b.angularVelocity.set(0, 0, rnd(-3, 3));
  b.userData = { falling: true };
  S.outer.addBody(b);
  const warn = new THREE.Mesh(new THREE.CircleGeometry(0.75, 16), new THREE.MeshBasicMaterial({ color: 0xff3b3b, transparent: true, opacity: 0.5, depthWrite: false }));
  warn.rotation.x = -Math.PI / 2;
  warn.position.set(x, y + 0.04, 0);
  S.env.add(warn);
  S.falling.push({ b, m, warn, y, life: 5 });
}
function syncGroup(g, b) {
  g.quaternion.set(b.quaternion.x, b.quaternion.y, b.quaternion.z, b.quaternion.w);
  const off = new THREE.Vector3(0, CENTER_Y, 0).applyQuaternion(g.quaternion);
  g.position.set(b.position.x - off.x, b.position.y - off.y, b.position.z - off.z);
}
function raceVisuals(dt) {
  for (const r of S.rivals) syncGroup(r.g, r.b);
  for (const d of S.track.doors) {
    d.m.position.set(d.x, d.y, d.b.position.z);
    const red = d.open < 0.5;
    d.lamp.material.color.setHex(red ? 0xff3b3b : 0x7bc96f);
    d.lamp.material.emissive.setHex(red ? 0xff2200 : 0x2ec400);
  }
  for (const p of S.track.pends) {
    p.sack.position.set(p.b.position.x, p.b.position.y - 0.2, 0);
    p.sack.rotation.z = Math.atan2(p.b.position.x - p.pivot.x, p.pivot.y - p.b.position.y);
    const mid = new THREE.Vector3().addVectors(p.pivot, p.b.position).multiplyScalar(0.5);
    const len = p.pivot.distanceTo(new THREE.Vector3(p.b.position.x, p.b.position.y, 0));
    p.rope.position.copy(mid);
    p.rope.scale.set(1, len, 1);
    p.rope.rotation.z = p.sack.rotation.z;
  }
  for (const f of S.falling) { f.m.position.copy(f.b.position); f.m.quaternion.copy(f.b.quaternion); }
  for (const p of S.track.springs) { p.t = Math.max(0, (p.t || 0) - dt); p.m.scale.y = 1 - p.t * 1.6; }
  const bp = S.body.position;
  for (const s of S.track.stickers) {
    if (s.got) continue;
    s.m.rotation.y += dt * 3;
    if (Math.abs(s.x - bp.x) < 1.9 && Math.abs(s.y - bp.y) < 1.7) {
      s.got = true;
      s.m.visible = false;
      S.stats.stickers++;
      sfx.star(S.stats.stickers % 3);
      burst(s.m.position.clone(), 0xffd166, 6, 2, 0.06);
      $('#stickN').textContent = S.stats.stickers;
    }
  }
  // HUD: место и соперники на полоске
  const pl = placeNow();
  $('#placeN').textContent = pl;
  $('#race').classList.toggle('first', pl === 1);
  const span = S.track.finishX - S.track.startX;
  S.rivals.forEach((r, k) => {
    const pr = Math.max(0, Math.min(1, (r.b.position.x - S.track.startX) / span));
    const el = $('#rv' + k);
    if (el) el.style.left = pr * 100 + '%';
  });
}

function startJourney() {
  const L = S.L;
  S.phase = 'journey';
  clearEnv();
  const th = THEMES[L.theme];
  scene.background = new THREE.Color(th.bg);
  scene.fog = new THREE.Fog(th.bg, 30, 90);
  const g = L.gravity;
  S.g = g;
  S.outer = new CANNON.World({ gravity: new CANNON.Vec3(0, -g, 0) });
  S.outer.solver.iterations = 10;
  S.outer.defaultContactMaterial.friction = 0.4;
  S.outer.defaultContactMaterial.restitution = 0.05;
  S.outer.addContactMaterial(new CANNON.ContactMaterial(MAT.suit, MAT.ground, { friction: L.friction, restitution: 0.08 }));
  S.outer.addContactMaterial(new CANNON.ContactMaterial(MAT.suit, MAT.slick, { friction: 0.0, restitution: 0.05 }));
  S.outer.addContactMaterial(new CANNON.ContactMaterial(MAT.suit, MAT.suit, { friction: 0.2, restitution: 0.3 }));
  S.rivals = [];
  S.falling = [];
  S.finishOrder = [];
  S.raceT = 0;
  S.saidT = 0;
  S.boostT = 0;
  S.springCd = 0;
  S.track = buildTrack(L);
  S.env.add(S.suit);
  S.suit.scale.set(1, 1, 1);
  if (S.lidLine) { S.suit.remove(S.lidLine); S.lidLine = null; }
  if (S.ghost) S.suit.remove(S.ghost);
  for (const i of S.insts) if (i.mk) { S.suit.remove(i.mk); i.mk = null; }
  // как упаковал хрупкое, так оно и поедет
  for (const i of bag()) if (i.def.fragile) i.prot = i.fragBad ? (i.heavyOn ? 0.7 : 0.85) : 1.8;
  S.sc.lidPivot.rotation.x = 0;
  S.lidAngle = 0;
  S.massItems = bag().reduce((s, i) => s + i.def.mass, 0);
  const b = new CANNON.Body({ mass: 3 + S.massItems, material: MAT.suit, shape: new CANNON.Box(new CANNON.Vec3(W / 2 + T, HALF_Y, D / 2 + T)), linearDamping: 0.05, angularDamping: 0.35 });
  b.position.set(S.track.startX, HALF_Y + 0.6, 0);
  b.linearFactor.set(1, 1, 0);
  b.angularFactor.set(0, 0, 1);
  b.addEventListener('collide', (e) => {
    const v = Math.abs(e.contact.getImpactVelocityAlongNormal());
    if (v > 3) { sfx.thud(); haptic(v > 7 ? 'heavy' : 'medium'); S.shake = Math.max(S.shake, Math.min(0.35, v * 0.035)); }
    const o = e.body.userData || {};
    if (o.pendulum && S.hitT <= 0) {
      S.hitT = 1;
      S.post.push(() => { b.velocity.x = Math.min(b.velocity.x, 0) - 6; b.velocity.y = 4; });
      toast(pick(['Бах! Мешком!', 'Мешок картошки атакует!', 'Ой-ой!']), 1.1);
      haptic('heavy');
    }
    if (o.falling && S.hitT <= 0 && v > 2) {
      S.hitT = 0.8;
      S.post.push(() => { b.velocity.x *= 0.4; });
      toast(pick(['Сверху прилетело!', 'Чей-то багаж!', 'По крышке!']), 1);
    }
    if (o.rival && b.position.y > e.body.position.y + 1.3 && S.hitT <= 0) {
      S.hitT = 0.6;
      const r = o.rival;
      r.stun = 1.3;
      S.stats.stomps++;
      S.post.push(() => { b.velocity.y = 6.5 * Math.sqrt(S.g / 9.8); e.body.velocity.x *= 0.2; });
      toast('Прыг по ' + (r.cfg.name.startsWith('Баул') ? 'баулу!' : r.cfg.name.startsWith('Сумка') ? 'сумке!' : 'чемодану!'), 1);
      sfx.squeak();
    }
  });
  S.outer.addBody(b);
  S.body = b;
  S.prevV = new CANNON.Vec3();
  S.safe = { x: b.position.x, y: 0 };
  S.fen = bag().filter((i) => i.def.power === 'fen').length * 2;
  S.journeyT = 0;
  S.upsideT = 0;
  S.coyote = 0;
  S.wantJump = false;
  S.wantFen = false;
  S.inflated = false;
  S.eggAt = rnd(6, 16);
  S.eggLaid = false;
  S.cam = null;
  S.hitT = 0;
  S.countdown = 3.4;
  S.cdShown = 4;
  // соперники: двое впереди, один сзади
  const sk = L.rivalSkill || 0.85;
  addRival(RIVALS[0], S.track.startX + 4.2, 0, sk);
  addRival(RIVALS[1], S.track.startX + 8.4, 0, sk);
  addRival(RIVALS[2], S.track.startX - 4.2, 0, sk);
  $('#stickN').textContent = '0';
  updateFenBtn();
  if (!S.xrayCam) {
    S.xrayCam = new THREE.OrthographicCamera(-1.85, 1.85, 1.3, -1.3, 0.1, 20);
    S.xrayCam.layers.set(1);
    S.xrayLines = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(W, H, D)), new THREE.LineBasicMaterial({ color: 0x8edceb }));
    S.xrayMat = new THREE.MeshBasicMaterial({ color: 0x5aa9e6, transparent: true, opacity: 0.55, blending: THREE.AdditiveBlending, depthWrite: false });
  }
  S.xrayLines.position.set(0, H / 2, 0);
  S.xrayLines.layers.set(1);
  S.suit.add(S.xrayLines);
  S.xrayCam.position.set(0, H / 2, 6);
  S.xrayCam.lookAt(0, H / 2, 0);
  S.suit.add(S.xrayCam);
  S.xrayCam.lookAt(S.suit.localToWorld(new THREE.Vector3(0, H / 2, 0)));
  showLayers('top', 'journey');
  setViewOffset(-10);
  syncSuit();
}

function updateFenBtn() {
  const btn = $('#fenBtn');
  btn.style.visibility = S.fen > 0 ? 'visible' : 'hidden';
  $('#fenN').textContent = '×' + S.fen;
  $('#fenImg').src = THUMBS.fen;
}

function bagCOM() {
  let m = 0;
  const c = new CANNON.Vec3();
  for (const i of bag()) if (i.body) { c.x += i.body.position.x * i.def.mass; c.y += i.body.position.y * i.def.mass; c.z += i.body.position.z * i.def.mass; m += i.def.mass; }
  if (!m) return new CANNON.Vec3(0, CENTER_Y, 0);
  return c.scale(1 / m);
}

function isGrounded() {
  const b = S.body;
  S.groundBody = null;
  for (const c of S.outer.contacts) {
    if (c.bi !== b && c.bj !== b) continue;
    const ny = c.bi === b ? -c.ni.y : c.ni.y;
    if (ny > 0.5) { S.groundBody = c.bi === b ? c.bj : c.bi; return true; }
  }
  return false;
}

function journeyTick(dt) {
  const b = S.body;
  const g = S.g;
  S.raceT += dt;
  S.hitT -= dt; S.boostT -= dt; S.springCd -= dt; S.saidT -= dt;
  if (S.countdown > 0) {
    S.countdown -= dt;
    const n = Math.ceil(S.countdown);
    if (n !== S.cdShown) {
      S.cdShown = n;
      if (n > 0) { toast(String(n), 0.8); sfx.tick(); } else { toast('Марш!', 0.9); sfx.star(2); haptic('medium'); }
    }
  }
  const active = S.phase === 'journey' && S.countdown <= 0;
  if (active) S.journeyT += dt;
  const gi = groundInfo(b);
  S.groundBody = gi.gb;
  const grounded = gi.ok;
  if (grounded) S.coyote = 0.15; else S.coyote -= dt;
  const dir = active ? (S.in.right ? 1 : 0) - (S.in.left ? 1 : 0) : 0;
  let cap = S.boostT > 0 ? 13.5 : 8.5;
  if (gi.belt < 0) cap += gi.belt * 0.6;
  if (dir) {
    const f = (grounded ? 16 : 7) * b.mass;
    if ((dir > 0 && b.velocity.x < cap) || (dir < 0 && b.velocity.x > -6)) b.force.x += dir * f;
  } else if (grounded && S.L.friction < 0.1) {
    b.force.x -= b.velocity.x * 0.15 * b.mass;
  }
  if (gi.belt > 0 && b.velocity.x < gi.belt) b.force.x += 9 * b.mass;
  if (gi.belt < 0) b.force.x += gi.belt * 1.5 * b.mass;
  padsFor(b, S, grounded);
  // тяжёлые вещи кренят чемодан
  const com = bagCOM();
  const r = b.quaternion.vmult(new CANNON.Vec3(com.x, com.y - CENTER_Y, com.z));
  b.torque.z += -r.x * S.massItems * g * 0.8;
  uprightTorque(b, grounded);
  for (const r of S.rivals) rivalTick(r, dt);
  obstaclesTick(dt);
  if (S.inflated) b.force.y += 0.62 * b.mass * g;
  if (S.wantJump) {
    S.wantJump = false;
    if (S.coyote > 0 && active) {
      b.velocity.y = 7.2 * Math.sqrt(g / 9.8) * (S.inflated ? 0.8 : 1);
      S.coyote = 0;
      sfx.boing();
      haptic('light');
    }
  }
  if (S.wantFen) {
    S.wantFen = false;
    if (S.fen > 0 && active) {
      S.fen--;
      updateFenBtn();
      b.velocity.x = Math.max(b.velocity.x, 0) + 8;
      b.velocity.y = Math.max(b.velocity.y, 4.5 * Math.sqrt(g / 9.8));
      sfx.whoosh();
      haptic('medium');
      toast(pick(['Фу-у-ух!', 'Реактивный фен!', 'Турбо-режим!']), 0.9);
      const p = new THREE.Vector3(); S.suit.getWorldPosition(p);
      burst(p.add(new THREE.Vector3(-W / 2 - 0.3, 0.6, 0)), 0xffffff, 12, 3, 0.1);
    }
  }
  S.outer.step(dt);
  runPost();
  // внутри чемодана: вещи чувствуют толчки
  const dv = b.velocity.vsub(S.prevV);
  S.prevV.copy(b.velocity);
  const qi = b.quaternion.conjugate();
  const dvl = qi.vmult(dv);
  const k = 0.7;
  for (const i of bag()) if (i.body) { i.body.velocity.x -= dvl.x * k; i.body.velocity.y -= dvl.y * k; i.body.velocity.z -= dvl.z * k; }
  S.inner.gravity.copy(qi.vmult(new CANNON.Vec3(0, -g, 0)));
  S.inner.step(dt);
  runPost();
  if (active) {
    aliveTick(dt);
    journeyEvents(dt);
  }
  if (grounded && Math.abs(b.velocity.y) < 2) S.safe = { x: b.position.x, y: b.position.y - HALF_Y };
  if (b.position.y < S.track.minY - 9) respawn();
  const up = b.quaternion.vmult(new CANNON.Vec3(0, 1, 0));
  if (up.y < 0.35 && b.velocity.length() < 2.5) S.upsideT += dt; else S.upsideT = 0;
  if (S.upsideT > 1.1) {
    S.upsideT = 0;
    b.quaternion.set(0, 0, 0, 1);
    b.position.y += 1.4;
    b.angularVelocity.set(0, 0, 0);
    S.prevV.copy(b.velocity);
    toast('Оп! Поставили на колёса.', 1.2);
    sfx.pop();
  }
  if (active && b.position.x > S.track.finishX) arrive();
}

function journeyEvents(dt) {
  const b = S.body;
  const x = b.position.x;
  for (const gl of S.track.gloves) {
    if (!gl.done && x > gl.x) {
      gl.done = true;
      gl.t = 0;
      b.velocity.y = 9.5 * Math.sqrt(S.g / 9.8);
      b.velocity.x += 5;
      b.angularVelocity.z = -5;
      sfx.whoosh();
      haptic('heavy');
      toast('Грузчик Валера кинул чемодан!', 1.6);
    }
  }
  for (const t of S.track.triggers) {
    if (t.done || x < t.x) continue;
    t.done = true;
    if (t.type === 'inflate') {
      const fl = bag().find((i) => i.id === 'flamingo');
      if (fl) inflate(fl);
    }
  }
  const ch = bag().find((i) => i.id === 'chicken' && i.body);
  if (ch && !S.eggLaid && S.journeyT > S.eggAt) {
    S.eggLaid = true;
    S.stats.eggs++;
    const egg = newInst('egg');
    egg.inBag = true;
    S.insts.push(egg);
    S.suit.add(egg.mesh);
    const p = ch.body.position;
    addBody(egg, new CANNON.Vec3(Math.max(-1.3, Math.min(1.3, p.x - 0.35)), Math.min(H - 0.2, p.y + 0.1), p.z), null);
    sfx.cluck();
    toast('Курица снесла яйцо! Прямо в чемодане.', 1.8);
  }
  for (const i of bag()) {
    if (!i.def.melts || !i.body) continue;
    i.melt = (i.melt ?? 1) - dt / 40;
    if (i.melt < 0.3) {
      removeBody(i);
      S.suit.remove(i.mesh);
      i.lost = true;
      i.melted = true;
      S.stats.melted = true;
      toast('Лёд растаял. Ну, бывает.', 1.5);
    } else if (Math.floor(i.melt * 10) !== Math.floor((i.melt + dt / 40) * 10)) {
      const pos = i.body.position.clone(); const q = i.body.quaternion.clone();
      removeBody(i);
      i.sx = i.sy = i.sz = i.melt;
      i.mesh.scale.setScalar(i.melt);
      addBody(i, pos, q);
    }
  }
}

function inflate(fl) {
  S.inflated = true;
  S.stats.inflated = true;
  sfx.inflate();
  haptic('heavy');
  toast('Фламинго надулся!! Летим!', 2);
  const g = new THREE.Group();
  const ball = mesh(ico(1.25, 1), 0xff7eb6);
  ball.scale.set(1.25, 0.85, 1);
  g.add(ball);
  const neck = rot(at(mesh(cyl(0.18, 0.22, 1.6, 6), 0xff7eb6), 1.1, 1.0, 0), 0, 0, -0.4);
  g.add(neck);
  const head = at(mesh(ico(0.35), 0xff97c4), 1.5, 1.85, 0);
  head.add(at(googly(0.14), 0.05, 0.08, 0.28));
  head.add(rot(at(mesh(cone(0.12, 0.4, 4), 0x2b2140), 0.4, -0.05, 0), 0, 0, -Math.PI / 2));
  g.add(head);
  g.position.set(0, TOP + 0.8, 0);
  g.scale.setScalar(0.05);
  S.suit.add(g);
  S.balloon = g;
  fl.mesh.visible = false;
}

function respawn() {
  const b = S.body;
  b.position.set(S.safe.x - 1.5, S.safe.y + HALF_Y + 1.6, 0);
  b.velocity.set(0, 0, 0);
  b.angularVelocity.set(0, 0, 0);
  b.quaternion.set(0, 0, 0, 1);
  S.prevV.set(0, 0, 0);
  S.stats.falls++;
  sfx.splat();
  haptic('heavy');
  toast(pick(['Плюх! Ещё разок!', 'Чемодан нырнул. Достали!', 'Ой! Попробуем снова!']), 1.4);
}

function arrive() {
  S.phase = 'arrive';
  S.in.left = S.in.right = false;
  S.place = 1 + S.finishOrder.length;
  sfx.win();
  hapticNote('success');
  toast(S.place === 1 ? 'Первое место!!!' : S.place + '-е место. Приехали!', 1.6);
  later(1.4, startFinale);
}

function syncSuit() {
  const b = S.body;
  S.suit.quaternion.set(b.quaternion.x, b.quaternion.y, b.quaternion.z, b.quaternion.w);
  const off = new THREE.Vector3(0, CENTER_Y, 0).applyQuaternion(S.suit.quaternion);
  S.suit.position.set(b.position.x - off.x, b.position.y - off.y, b.position.z - off.z);
}

function bindHold(btn, key) {
  const on = (e) => { e.preventDefault(); initAudio(); S.in[key] = true; };
  const off = () => { S.in[key] = false; };
  btn.addEventListener('pointerdown', on);
  btn.addEventListener('pointerup', off);
  btn.addEventListener('pointerleave', off);
  btn.addEventListener('pointercancel', off);
}
bindHold($('#leftBtn'), 'left');
bindHold($('#rightBtn'), 'right');
$('#hopBtn').addEventListener('pointerdown', (e) => { e.preventDefault(); S.wantJump = true; });
$('#fenBtn').addEventListener('pointerdown', (e) => { e.preventDefault(); S.wantFen = true; });
window.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') S.in.left = true;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') S.in.right = true;
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') { S.wantJump = true; if (S.lid) $('#jumpBtn').dispatchEvent(new PointerEvent('pointerdown')); }
  if (e.code === 'KeyF' || e.code === 'ShiftLeft') S.wantFen = true;
});
window.addEventListener('keyup', (e) => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') S.in.left = false;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') S.in.right = false;
});

// ---------- 4. ФИНАЛ ----------
function buildFinaleScene(theme) {
  const e = S.env;
  const th = THEMES[theme];
  scene.background = new THREE.Color(th.bg);
  const groundColor = theme === 'airport' ? 0xffe0a0 : th.top;
  e.add(at(mesh(box(60, 0.4, 40), groundColor), 0, -0.2, -6));
  if (theme === 'village') {
    const h = makeHouse(1.6); h.position.set(-1.5, 0, -7); e.add(h);
    const f = makeFence(8); f.position.set(-8, 0, -4); e.add(f);
    const f2 = makeFence(8); f2.position.set(3, 0, -4); e.add(f2);
    [[-7, -9], [6, -8], [9, -12], [-10, -12]].forEach(([x, z]) => { const t = makeTree(1.3); t.position.set(x, 0, z); e.add(t); });
  } else if (theme === 'airport') {
    e.add(at(mesh(box(80, 0.3, 30), 0x2ec4b6), 0, -0.1, -26));
    [[-6, -8], [5, -9], [9, -6]].forEach(([x, z]) => { const p = makePalm(1.3); p.position.set(x, 0, z); e.add(p); });
    e.add(at(mesh(ico(4, 1), 0xffd166), 12, 14, -40));
  } else if (theme === 'ice') {
    e.add(at(mesh(cyl(0.7, 0.7, 0.05, 10), 0x3e8ed0), -3, 0.02, 1));
    [[-8, -10], [6, -9], [10, -14]].forEach(([x, z]) => { const t = makeTree(1.4, 0xeaf8fc); t.position.set(x, 0, z); e.add(t); });
    [[-4, -14], [4, -16]].forEach(([x, z]) => e.add(at(mesh(cone(5, 4, 6), 0xffffff), x, 2, z)));
  } else {
    const g = new THREE.BufferGeometry();
    const pts = [];
    for (let i = 0; i < 400; i++) pts.push(rnd(-80, 80), rnd(3, 60), rnd(-80, -30));
    g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
    e.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: 0.4 })));
    const earth = at(mesh(ico(5, 1), 0x5aa9e6), -10, 16, -50); earth.add(at(mesh(ico(2.5, 0), 0x7bc96f), 2, 1.5, 3.5)); e.add(earth);
    const f = makeFlag(); f.position.set(-5, 0, -4); e.add(f);
    [[5, -6], [-8, -8], [8, -10]].forEach(([x, z]) => { const r = makeRock(1.2); r.position.set(x, 0.2, z); e.add(r); });
  }
}

function startFinale() {
  const L = S.L;
  S.phase = 'finale';
  clearEnv();
  buildFinaleScene(L.theme);
  S.suit.remove(S.xrayCam);
  S.suit.remove(S.xrayLines);
  if (S.balloon) { S.suit.remove(S.balloon); S.balloon = null; }
  S.env.add(S.suit);
  S.suit.quaternion.set(0, 0, 0, 1);
  S.suit.position.set(-0.4, -BOT, 0);
  S.suit.rotation.y = 0.15;
  const person = makePerson(L.client);
  person.scale.setScalar(1.2);
  person.position.set(2.5, 0, 0.2);
  person.rotation.y = -0.45;
  S.env.add(person);
  let granny = null;
  if (L.grandmaCameo) {
    granny = makePerson(LEVELS[0].client);
    granny.scale.setScalar(1.1);
    granny.position.set(-2.9, 0, 0.3);
    granny.rotation.y = 0.5;
    S.env.add(granny);
  }
  S.fin = { t: 0, opened: false, flown: false, shown: false, person, granny, res: computeResults() };
  setSun(0, 0, 0);
  showLayers('top', 'finale');
  $('#res').classList.remove('show');
  setViewOffset(150);
}

function finaleTick(dt) {
  const F = S.fin;
  if (!F) return;
  F.t += dt;
  const ud = F.person.userData;
  if (F.t < 0.9) S.suit.rotation.z = Math.sin(F.t * 40) * 0.03;
  else S.suit.rotation.z = 0;
  if (!F.opened && F.t > 0.9) {
    F.opened = true;
    sfx.pop();
    sfx.zip();
  }
  if (F.opened) S.lidAngle += (LID_OPEN - S.lidAngle) * Math.min(1, dt * 6);
  if (!F.flown && F.t > 1.2) { F.flown = true; launchItems(F); }
  const happy = F.res.all;
  if (F.t > 1.6) {
    const j = happy ? Math.abs(Math.sin(F.t * 5)) * 0.3 : 0;
    F.person.position.y = j;
    ud.armL.rotation.z += ((happy ? -2.6 : -0.6) - ud.armL.rotation.z) * 0.1;
    ud.armR.rotation.z += ((happy ? 2.6 : 0.6) - ud.armR.rotation.z) * 0.1;
    ud.mouth.scale.y = happy ? 2.5 : 1;
    if (F.granny) {
      F.granny.position.y = Math.abs(Math.sin(F.t * 4 + 1)) * 0.25;
      F.granny.userData.armR.rotation.z = 2.5 + Math.sin(F.t * 8) * 0.4;
    }
  }
  if (!F.shown && F.t > 3.4) { F.shown = true; showResults(F.res); }
}

function launchItems(F) {
  S.suit.updateMatrixWorld(true);
  const items = bag();
  const head = F.person.userData.head;
  let k = 0;
  for (const inst of items) {
    const m = inst.mesh;
    S.env.attach(m);
    const delay = k++ * 0.12;
    const hy = (inst.broken ? 0.1 : (inst.def.size.y * inst.sy) / 2);
    if (inst.id === 'chicken' && !inst.broken) {
      later(delay, () => {
        const to = head.getWorldPosition(new THREE.Vector3()).add(new THREE.Vector3(0, 0.55, 0));
        flyTo(m, to, 0.9, 2.5, () => { F.person.userData.head.attach(m); sfx.cluck(); toast('Курица теперь живёт тут.', 1.5); });
        sfx.cluck();
      });
    } else if (inst.id === 'cake' && inst.broken) {
      later(delay, () => {
        const to = head.getWorldPosition(new THREE.Vector3()).add(new THREE.Vector3(0, 0, 0.25));
        flyTo(m, to, 0.7, 1.5, () => {
          S.env.remove(m);
          const splat = new THREE.Group();
          const s1 = mesh(ico(0.26, 0), 0xff9ec4); s1.scale.set(1.2, 0.9, 0.45); splat.add(s1);
          const s2 = mesh(ico(0.16, 0), 0xffffff); s2.scale.set(1.2, 0.8, 0.5); s2.position.set(0.05, 0.08, 0.06); splat.add(s2);
          splat.add(at(mesh(ico(0.07), 0xff3b3b), -0.05, 0.16, 0.12));
          splat.position.set(0, 0.0, 0.27);
          F.person.userData.head.add(splat);
          sfx.splat();
          haptic('heavy');
          toast('Торт — прямо в лицо!', 1.6);
        });
      });
    } else if (inst.id === 'jar' && !inst.broken) {
      later(delay, () => {
        const to = F.person.position.clone().add(new THREE.Vector3(-0.35, 1.2, 0.55));
        flyTo(m, to, 1.0, 2.2, () => {
          const glow = new THREE.PointLight(0xffd166, 6, 3);
          m.add(glow);
          m.rotation.set(0, 0, 0);
          burst(m.position.clone(), 0xffd166, 14, 2.5, 0.08);
          sfx.star(2);
        });
      });
    } else {
      later(delay, () => {
        m.visible = true;
        m.scale.set(inst.sx, inst.sy, inst.sz);
        const v = new THREE.Vector3(rnd(-3.2, 2.2), rnd(5, 7.5), rnd(0.8, 2.4));
        flyBallistic(m, v, new THREE.Vector3(rnd(-6, 6), rnd(-6, 6), rnd(-6, 6)), hy, () => { if (inst.def.squeak) sfx.squeak(); else sfx.drop(); });
        if (inst.def.alive === 'hop') sfx.cluck();
      });
    }
  }
}

function computeResults() {
  const L = S.L;
  const need = {};
  for (const id of L.required) need[id] = (need[id] || 0) + 1;
  const have = {};
  for (const i of bag()) if (!i.broken) have[i.id] = (have[i.id] || 0) + 1;
  let got = 0;
  for (const id in need) got += Math.min(need[id], have[id] || 0);
  const total = L.required.length;
  const all = got === total;
  const clean = S.stats.broken === 0 && S.stats.ejected === 0;
  const fast = S.journeyT <= L.par;
  const pk = S.packAtClose || { over: 1, fragBad: 1, bal: 1 };
  const lidOk = pk.over === 0;
  const packN = (pk.got === pk.total ? 1 : 0) + (lidOk ? 1 : 0) + (pk.fragBad === 0 ? 1 : 0) + (Math.abs(pk.bal) < 0.3 ? 1 : 0);
  const place = S.place || 4;
  const stars = 1 + (all ? 1 : 0) + (place === 1 ? 1 : 0);
  const jar = bag().some((i) => i.id === 'jar' && !i.broken);
  const st = S.stats;
  const absurd = 100 * (st.eggs + st.pigeons + st.ejected + st.broken + st.falls + st.squashed) + (st.inflated ? 300 : 0) + st.jumps * 20;
  const ev = [];
  ev.push(packN === 4 ? 'Идеальная упаковка' : 'Упаковка ' + packN + '/4');
  if (st.stomps) ev.push('Прыжков по соперникам: ' + st.stomps);
  if (st.home) ev.push('Оставлено дома: ' + st.home);
  if (st.eggs) ev.push('Яйцо в дороге');
  if (st.pigeons) ev.push('Голубей: ' + st.pigeons);
  if (st.falls) ev.push('Нырков: ' + st.falls);
  if (st.inflated) ev.push('Фламинго-шар');
  if (st.ejected) ev.push('Улетело: ' + st.ejected);
  if (st.melted) ev.push('Лёд растаял');
  if (bag().some((i) => i.id === 'cat')) ev.push('Кот всё проспал');
  if (bag().some((i) => i.id === 'gnome')) ev.push('Гном что-то знает');
  let line = all ? L.win : jar ? L.jarLine : L.fail;
  if (!all && !clean && !jar && st.broken > 1) line = L.fail;
  let next = '';
  if (!all) next = 'Звезда — за весь заказ, довезённый целым';
  if (place !== 1) next = (next ? next + '. ' : '') + 'Звезда — за первое место в гонке';
  return { stars, got, total, all, broken: st.broken, absurd: absurd + (packN === 4 ? 500 : 0), ev, line, fast, next, place, stickers: st.stickers };
}

function showResults(r) {
  $('#stats').innerHTML = `<div style="background:#EAF8EC"><b>${r.got} / ${r.total}</b><small>довезли</small></div>`
    + `<div style="background:${r.place === 1 ? '#FFF6D9' : '#FFF0F5'}"><b>${r.place}-е</b><small>место</small></div>`
    + `<div style="background:#EEF5FB"><b>${r.stickers}</b><small>наклеек</small></div>`;
  $('#events').innerHTML = r.ev.slice(0, 4).map((e) => `<span>${e}</span>`).join('');
  $('#line').textContent = '«' + r.line + '»';
  $('#starHint').textContent = r.next;
  $('#starHint').style.display = r.next ? '' : 'none';
  const stars = $('#stars').children;
  for (let i = 0; i < 3; i++) stars[i].classList.remove('on');
  for (let i = 0; i < r.stars; i++) later(0.35 + i * 0.35, () => { stars[i].classList.add('on'); sfx.star(i); haptic('light'); });
  $('#res').classList.add('show');
  $('#nextBtn').textContent = S.li < LEVELS.length - 1 ? 'Дальше' : 'К уровням';
  try {
    const all = JSON.parse(localStorage.getItem('chemodan-stars') || '{}');
    all[S.L.id] = Math.max(all[S.L.id] || 0, r.stars);
    localStorage.setItem('chemodan-stars', JSON.stringify(all));
  } catch (e) {}
  S.lastStars = r.stars;
}

$('#againBtn').addEventListener('click', () => startLevel(S.li));
$('#nextBtn').addEventListener('click', () => { if (S.li < LEVELS.length - 1) startLevel(S.li + 1); else goLevels(); });
$('#shareBtn').addEventListener('click', () => {
  const url = SHARE_URL || location.href.split('#')[0];
  const text = `Я довёз чемодан «${S.L.title}» на ${S.lastStars || 1}★! А ты сможешь?`;
  const link = `https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(text)}`;
  try {
    if (inTg && tg.openTelegramLink) tg.openTelegramLink(link);
    else if (navigator.share) navigator.share({ title: 'Чемодан без ручки', text, url }).catch(() => {});
    else window.open(link, '_blank');
  } catch (e) { window.open(link, '_blank'); }
});
$('#homeBtn').addEventListener('click', () => { goLevels(); });
$('#playBtn').addEventListener('click', () => { initAudio(); sfx.pop(); goLevels(); });
function renderSound() { $('#soundBtn').innerHTML = 'ЗВУК<br>' + (muted ? 'ВЫКЛ' : 'ВКЛ'); }
$('#soundBtn').addEventListener('click', () => {
  initAudio();
  muted = !muted;
  setMuted(muted);
  try { localStorage.setItem('chemodan-muted', muted ? '1' : '0'); } catch (e) {}
  renderSound();
});
renderSound();
document.addEventListener('contextmenu', (e) => e.preventDefault());
document.addEventListener('pointerdown', () => { initAudio(); if (muted) setMuted(true); }, { once: true });

// ---------- камера ----------
const camPos = new THREE.Vector3(0, 6, 9);
const camLook = new THREE.Vector3(0, 0.5, 0);
function fitDist(halfW, fovDeg) {
  const hf = 2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(fovDeg / 2)) * camera.aspect);
  return halfW / Math.tan(hf / 2);
}
function updateCamera(dt) {
  let pos, look, fov = 45;
  const p = S.phase;
  if (p === 'menu' || p === 'levels' || p === 'loading') {
    const d = Math.max(9, fitDist(2.6, fov));
    look = new THREE.Vector3(0, 0.9, 0);
    pos = new THREE.Vector3(0, 3.2, d);
  } else if (p === 'pack') {
    const d = Math.max(8, fitDist(2.0, fov));
    look = new THREE.Vector3(0, 0.5, 0.05);
    pos = look.clone().add(new THREE.Vector3(0, 2.1, 1).normalize().multiplyScalar(d));
  } else if (p === 'lid') {
    const d = Math.max(9, fitDist(2.6, fov));
    look = new THREE.Vector3(0, 1.5, 0);
    pos = look.clone().add(new THREE.Vector3(0, 0.55, 1).normalize().multiplyScalar(d));
  } else if (p === 'journey' || p === 'arrive') {
    fov = 50;
    const b = S.body;
    const d = Math.max(12, fitDist(6.2, fov));
    look = new THREE.Vector3(b.position.x + 2.4, b.position.y + 0.9, 0);
    pos = new THREE.Vector3(b.position.x + 2.4, b.position.y + 3.0, d);
  } else if (p === 'finale') {
    const d = Math.max(9, fitDist(3.6, fov));
    look = new THREE.Vector3(0.4, 1.3, 0);
    pos = new THREE.Vector3(0.4, 3.4, d);
  } else return;
  if (camera.fov !== fov) { camera.fov = fov; camera.updateProjectionMatrix(); }
  const k = S.camSnap ? 1 : 1 - Math.exp(-dt * (p === 'journey' ? 5 : 3));
  camPos.lerp(pos, k);
  camLook.lerp(look, k);
  S.camSnap = false;
  camera.position.copy(camPos);
  if (S.shake > 0) {
    camera.position.x += rnd(-1, 1) * S.shake;
    camera.position.y += rnd(-1, 1) * S.shake;
    S.shake = Math.max(0, S.shake - dt * 1.2);
  }
  camera.lookAt(camLook);
  setSun(camLook.x, camLook.y, 0);
}

// ---------- рентген ----------
let xrayRect = null;
function drawXray() {
  const el = $('#xray');
  const r = el.getBoundingClientRect();
  if (!r.width) return;
  const h = window.innerHeight;
  renderer.setScissorTest(true);
  renderer.setViewport(r.left, h - r.bottom, r.width, r.height);
  renderer.setScissor(r.left, h - r.bottom, r.width, r.height);
  renderer.setClearColor(0x1b1530, 1);
  renderer.clear();
  const bg = scene.background, fog = scene.fog;
  scene.background = null; scene.fog = null;
  scene.overrideMaterial = S.xrayMat;
  renderer.shadowMap.autoUpdate = false;
  S.xrayCam.updateMatrixWorld(true);
  renderer.render(scene, S.xrayCam);
  renderer.shadowMap.autoUpdate = true;
  scene.overrideMaterial = null;
  scene.background = bg; scene.fog = fog;
  renderer.setScissorTest(false);
  renderer.setViewport(0, 0, window.innerWidth, window.innerHeight);
}

// ---------- главный цикл ----------
let lastT = performance.now();
let acc = 0;
const FIX = 1 / 60;
function fixed(dt) {
  switch (S.phase) {
    case 'pack': S.inner.step(dt); runPost(); aliveTick(dt); break;
    case 'lid': S.inner.step(dt); runPost(); lidTick(dt); break;
    case 'journey': case 'arrive': journeyTick(dt); break;
    default: break;
  }
}
function frame(dt) {
  S.time += dt;
  for (let i = S.later.length - 1; i >= 0; i--) {
    const l = S.later[i];
    l.t -= dt;
    if (l.t <= 0) { S.later.splice(i, 1); l.fn(); }
  }
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) $('#toast').classList.remove('on'); }
  if (S.phase === 'menu' || S.phase === 'levels') {
    if (S.menuSuit) { S.menuSuit.rotation.y = Math.sin(S.time * 0.5) * 0.6; S.menuSuit.position.y = Math.abs(Math.sin(S.time * 2.2)) * 0.25; }
  }
  if (['pack', 'lid', 'journey', 'arrive'].includes(S.phase)) syncItems();
  if (S.phase === 'pack') {
    updateHeld(dt);
    S.checkT -= dt;
    if (S.checkT <= 0) { S.checkT = 0.25; packCheck(); }
  }
  if (S.phase === 'pack' || S.phase === 'lid') updateMarkers();
  if (S.phase === 'pack' || S.phase === 'lid') {
    if (S.lid && !S.lid.done) S.lidAngle += (LID_OPEN * (1 - lidProg()) - S.lidAngle) * Math.min(1, dt * 8);
    if (S.lid && S.lid.done) S.lidAngle += (0 - S.lidAngle) * Math.min(1, dt * 10);
    S.squash = Math.max(0, S.squash - dt * 4);
    S.suit.scale.set(1 + S.squash * 0.07, 1 - S.squash * 0.14, 1 + S.squash * 0.05);
  }
  if (S.sc) S.sc.lidPivot.rotation.x = S.lidAngle ?? 0;
  if (S.phase === 'journey' || S.phase === 'arrive') {
    syncSuit();
    for (const d of dyn) { d.m.position.copy(d.b.position); d.m.quaternion.copy(d.b.quaternion); if (d.pigeon && !d.pigeon.hit) d.m.position.y += Math.abs(Math.sin(S.time * 3 + d.pigeon.t)) * 0.05 - 0.45; else if (d.pigeon) d.m.position.y -= 0.45; }
    for (const bl of S.belts) { const span = 1.2; const o = (((S.time * bl.speed * 0.6) % span) + span) % span; let x = bl.base + o; if (x > bl.x1 - 0.2) x -= Math.floor((bl.x1 - bl.x0) / span) * span; bl.m.position.x = x; }
    raceVisuals(dt);
    for (const gl of S.track.gloves) {
      if (gl.t < 0) continue;
      gl.t += dt;
      const k = gl.t < 0.25 ? gl.t / 0.25 : Math.max(0, 1 - (gl.t - 0.25) / 0.6);
      gl.m.position.y = gl.y + 9 - k * 7.2;
    }
    if (S.balloon) { const s = S.balloon.scale.x + (1 - S.balloon.scale.x) * Math.min(1, dt * 3); S.balloon.scale.setScalar(s); S.balloon.rotation.z = Math.sin(S.time * 2) * 0.08; }
    const pr = Math.max(0, Math.min(1, (S.body.position.x - S.track.startX) / (S.track.finishX - S.track.startX)));
    $('#progFill').style.width = pr * 100 + '%';
    $('#progDot').style.left = pr * 100 + '%';
  }
  if (S.phase === 'finale') finaleTick(dt);
  updateFlyers(dt);
  updateCamera(dt);
}
function draw() {
  renderer.setViewport(0, 0, window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x000000, 1);
  renderer.clear();
  renderer.render(scene, camera);
  if ((S.phase === 'journey' || S.phase === 'arrive') && S.xrayCam) drawXray();
}
function loop(now) {
  requestAnimationFrame(loop);
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 0.1) dt = 0.1;
  acc += dt;
  let n = 0;
  try {
    while (acc >= FIX && n < 4) { fixed(FIX); acc -= FIX; n++; }
    if (n === 4) acc = 0;
    frame(dt);
  } catch (e) { if (!S.errLogged) { console.error(e); S.errLogged = true; } }
  draw();
}

goMenu();
S.camSnap = true;
$('#loading').style.display = 'none';
requestAnimationFrame(loop);

// для отладки
window.__game = { S, startLevel, startLid, startJourney, startFinale, goMenu, LEVELS };

</script>
